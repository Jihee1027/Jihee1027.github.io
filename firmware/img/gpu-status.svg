<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 150" width="1040" height="150" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">GPU vertex stage status</title><desc id="d">Vertex stage integrated: 15 testbenches and 761 top-level checks pass, and Vivado meets 125 MHz. DSP slices cut from 40 to 13. Level 1 clipping added. The FPGA board test is blocked because the lab PCs do not detect the board. The rasterizer interface is still undefined.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="12" width="188.8" height="118" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="38" y="50.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">DONE</text><text x="38" y="67.51" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Vertex stage</text><text x="38" y="83.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">15 testbenches,</text><text x="38" y="99.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">761 checks pass</text><rect x="224.8" y="12" width="188.8" height="118" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="238.8" y="50.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">DONE</text><text x="238.8" y="67.51" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">DSP 40 to 13</text><text x="238.8" y="83.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">125 MHz met,</text><text x="238.8" y="99.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">+0.388 ns</text><rect x="425.6" y="12" width="188.8" height="118" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="439.6" y="50.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">DONE</text><text x="439.6" y="67.51" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Clipping, level 1</text><text x="439.6" y="83.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Drops triangles behind</text><text x="439.6" y="99.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">the near plane</text><rect x="626.4" y="12" width="188.8" height="118" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="640.4" y="50.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">BLOCKED</text><text x="640.4" y="67.51" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">FPGA whale test</text><text x="640.4" y="83.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Harness built at 100 MHz;</text><text x="640.4" y="99.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">board not detected</text><rect x="827.2" y="12" width="188.8" height="118" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="841.2" y="50.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">NEXT</text><text x="841.2" y="67.51" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Rasterizer interface</text><text x="841.2" y="83.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Needs a team</text><text x="841.2" y="99.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">decision</text></svg>