<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif"><title id="t">ECE 362 display driver</title><desc id="d">RP2350 in embedded C drives a TFT over 40 MHz SPI; one shared buffer and partial redraw cut RAM from 52.2% to 13.9%.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker></defs><rect width="480" height="300" fill="#ffffff"/><rect x="24" y="40" width="140" height="80" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="38" y="75.8" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">RP2350</text><text x="38" y="93.8" font-size="13" fill="#4d4d4d" text-anchor="start">Embedded C</text><path d="M168 80 L202 80" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="206" y="40" width="100" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="220" y="75.8" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">SPI</text><text x="220" y="93.8" font-size="13" fill="#4d4d4d" text-anchor="start">40 MHz</text><path d="M310 80 L344 80" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="348" y="40" width="108" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="362" y="75.8" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">TFT</text><text x="362" y="93.8" font-size="13" fill="#4d4d4d" text-anchor="start">4 screens</text><rect x="24" y="160" width="432" height="56" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="38" y="192.0" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">One shared buffer, partial redraw</text><text x="240" y="256" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">RAM 52.2% → 13.9%</text></svg>