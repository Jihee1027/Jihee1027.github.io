<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif"><title id="t">Balloon payload</title><desc id="d">A balloon payload to about 30 km with a Geiger-Muller tube, high-voltage board and sensors, read by Arduino and Raspberry Pi, tested and redesigned before launch.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker></defs><rect width="480" height="300" fill="#ffffff"/><rect x="140" y="24" width="200" height="56" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="154" y="56.0" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Balloon to ~30 km</text><path d="M240 84 L240 108" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="112" width="200" height="72" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="38" y="143.8" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Geiger–Müller</text><text x="38" y="161.8" font-size="13" fill="#4d4d4d" text-anchor="start">HV board, sensors</text><rect x="256" y="112" width="200" height="72" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="270" y="143.8" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Arduino + Pi</text><text x="270" y="161.8" font-size="13" fill="#4d4d4d" text-anchor="start">Python and C on Linux</text><path d="M228 148 L252 148" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="212" width="432" height="56" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="38" y="244.0" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Test and redesign before launch</text></svg>