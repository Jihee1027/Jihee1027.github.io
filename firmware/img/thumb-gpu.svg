<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">GPU vertex stage overview</title><desc id="d">Vertex stage with transform, perspective divide and screen-space steps; 13 DSP slices, 125 MHz, 28 cycles and 761 checks passing.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="20" y="36" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Fixed-point vertex pipeline</text><rect x="20" y="50" width="128" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="34" y="78.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Module 1</text><text x="34" y="95.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Transform</text><text x="34" y="112.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Matrix-vector</text><text x="34" y="128.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">multi