<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 486" width="1040" height="486" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Daily engineering loop</title><desc id="d">Seven steps from the morning production review to a verified result, with unresolved items returning to the next morning's list.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="36" y="40" width="216" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="50" y="70.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="50" y="87.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Morning review</text><text x="50" y="104.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Previous day issues, open</text><text x="50" y="120.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">corrective actions / POR items</text><rect x="287" y="40" width="216" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="301" y="70.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="301" y="87.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Production trend review</text><text x="301" y="104.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Spotfire and SPC: breakage,</text><text x="301" y="120.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">miscuts, downtime</text><rect x="538" y="40" width="216" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="552" y="70.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="552" y="87.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Inspection review</text><text x="552" y="104.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Defect images, vision footage,</text><text x="552" y="120.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">alarm timing</text><rect x="789" y="40" width="216" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="803" y="70.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="803" y="87.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Determine likely source</text><text x="803" y="104.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Line history, upstream to</text><text x="803" y="120.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">downstream, around the event</text><rect x="36" y="250" width="216" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="50" y="280.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="50" y="297.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Engineering report</text><text x="50" y="314.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Shared with Process, Equipment,</text><text x="50" y="330.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Production and Quality</text><rect x="287" y="250" width="216" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="301" y="280.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06</text><text x="301" y="297.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Line test</text><text x="301" y="314.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Controlled trials and</text><text x="301" y="330.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">sample inspection</text><rect x="538" y="250" width="216" height="104" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="552" y="280.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">07</text><text x="552" y="297.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Verify result</text><text x="552" y="314.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Compared with the</text><text x="552" y="330.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">production that follows</text><path d="M257 92 L282 92" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M508 92 L533 92" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M759 92 L784 92" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M897 149 L897 197 L144 197 L144 245" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M257 302 L282 302" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M508 302 L533 302" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="789" y="250" width="216" height="104" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="803" y="283.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Done means holding</text><text x="803" y="300.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The response shows in</text><text x="803" y="316.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">production data and</text><text x="803" y="332.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">stays after the change</text><path d="M759 302 L784 302" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M646 358 L646 404 L14 404 L14 92 L31 92" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_rust)"/><text x="634" y="424" font-size="12" font-weight="400" fill="#c47f00" text-anchor="end" font-style="italic">Anything that does not hold goes back on the next morning's list</text><rect x="24" y="456" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="468" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="456" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="138.672" y="468" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>