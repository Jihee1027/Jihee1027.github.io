<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">One sender at a time</title><desc id="d">Report tasks and the photo task submit jobs to a single first-in first-out queue. One worker runs one job at a time through the messaging app's UI automation.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="24" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Secondary figure: send-queue design</text><rect x="24" y="40" width="210" height="76" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="75.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Report tasks</text><text x="38" y="92.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Text, every cycle</text><rect x="24" y="150" width="210" height="76" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="185.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Photo task</text><text x="38" y="202.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Image batches (in development)</text><path d="M238 78 L262 78 L262 134 L286 134" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M238 188 L262 188 L262 134 L286 134" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="290" y="84" width="270" height="100" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="306" y="106" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">FIFO queue</text><rect x="306" y="120" width="50" height="42" rx="5" fill="#dae8fc" stroke="#333333" stroke-width="1.2"/><rect x="366" y="120" width="50" height="42" rx="5" fill="#ffe6cc" stroke="#333333" stroke-width="1.2"/><rect x="426" y="120" width="50" height="42" rx="5" fill="#dae8fc" stroke="#333333" stroke-width="1.2"/><rect x="486" y="120" width="50" height="42" rx="5" fill="#dae8fc" stroke="#333333" stroke-width="1.2"/><path d="M564 134 L612 134" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="616" y="84" width="180" height="100" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="630" y="123.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Single worker</text><text x="630" y="140.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">One job at a time,</text><text x="630" y="156.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">until it reports back</text><path d="M800 134 L848 134" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="852" y="84" width="164" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="866" y="123.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">UI automation</text><text x="866" y="140.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Selects the room,</text><text x="866" y="156.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">sends, confirms</text><rect x="24" y="250" width="992" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="38" y="283.28" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Why: UI automation drives the real keyboard and mouse, so two sends at once would collide.</text></svg>