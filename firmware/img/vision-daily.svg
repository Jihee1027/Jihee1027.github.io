<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 646" width="1040" height="646" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">A day of vision data checks</title><desc id="d">Morning: review overnight vision data, system health and over- and missed detection, then plan. Afternoon: investigate flagged views, adjust, verify with the same data, and record. All day: hourly alerts, and the troubleshooting ladder when a system goes down.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="24" width="488" height="424" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="44" y="52" font-size="11" font-weight="700" fill="#3d6fa5" text-anchor="start" letter-spacing="1.4">MORNING</text><text x="44" y="74" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">What happened since yesterday</text><rect x="44" y="92" width="448" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="58" y="112.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="58" y="127.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Overnight vision data</text><text x="58" y="143.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Defect rate by view, in</text><text x="58" y="158.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">SPC and Spotfire</text><path d="M268 173 L268 179" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="44" y="180" width="448" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="58" y="200.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="58" y="215.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">System health</text><text x="58" y="231.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Missed or false triggers,</text><text x="58" y="246.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">image-logging gaps, down events</text><path d="M268 261 L268 267" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="44" y="268" width="448" height="80" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="58" y="288.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="58" y="303.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">False positives and negatives</text><text x="58" y="319.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Which view drifted? Check</text><text x="58" y="334.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">against stored images</text><path d="M268 349 L268 355" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="44" y="356" width="448" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="58" y="376.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="58" y="391.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Plan the day</text><text x="58" y="407.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">What needs a recipe change</text><text x="58" y="422.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">or a bench check</text><rect x="528" y="24" width="488" height="424" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="548" y="52" font-size="11" font-weight="700" fill="#3d6fa5" text-anchor="start" letter-spacing="1.4">AFTERNOON</text><text x="548" y="74" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Act on it and prove it</text><rect x="548" y="92" width="448" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="562" y="112.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="562" y="127.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Investigate</text><text x="562" y="143.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Images and equipment logs</text><text x="562" y="158.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">for the flagged views</text><path d="M772 173 L772 179" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="548" y="180" width="448" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="562" y="200.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06</text><text x="562" y="215.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Fix or adjust</text><text x="562" y="231.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Recipe, camera, trigger</text><text x="562" y="246.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">timing or hardware</text><path d="M772 261 L772 267" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="548" y="268" width="448" height="80" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="562" y="288.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">07</text><text x="562" y="303.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Verify</text><text x="562" y="319.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Same data again, after the</text><text x="562" y="334.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">change, in production</text><path d="M772 349 L772 355" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="548" y="356" width="448" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="562" y="376.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">08</text><text x="562" y="391.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Record</text><text x="562" y="407.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">What changed, why, and</text><text x="562" y="422.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">what to keep watching</text><path d="M514 236 L526 236" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="468" width="488" height="84" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="38" y="499.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">All day: hourly updates</text><text x="38" y="515.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">An automated reporting tool sends</text><text x="38" y="531.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">hourly production updates</text><rect x="528" y="468" width="488" height="84" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="542" y="499.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">If a system goes down</text><text x="542" y="515.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Use the recovery routine</text><text x="542" y="531.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">(section 04), not guesswork</text><text x="24" y="584" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">A typical loop, not identical every day.</text><rect x="24" y="616" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="628" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="616" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="138.672" y="628" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Key point</text><rect x="218.6875" y="616" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="248.688" y="628" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="372.71875" y="616" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="402.719" y="628" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>