<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 224" width="1040" height="224" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif"><title id="t">How I debug and verify</title><desc id="d">Five steps: reproduce the failure, measure it with a scope, logic analyzer, logs or test data, isolate one cause at a time, fix one thing and re-run the same test, then add a check so it stays fixed. Every new build runs the checks again.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker></defs><rect width="1040" height="224" fill="#ffffff"/><text x="34" y="30" font-size="12" font-weight="700" fill="#3d6fa5" text-anchor="start">01</text><rect x="20" y="42" width="176" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="34" y="77.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Reproduce</text><text x="34" y="95.5" font-size="13" fill="#4d4d4d" text-anchor="start">Make the failure</text><text x="34" y="112.0" font-size="13" fill="#4d4d4d" text-anchor="start">happen on demand</text><path d="M200 90 L222 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="240" y="30" font-size="12" font-weight="700" fill="#3d6fa5" text-anchor="start">02</text><rect x="226" y="42" width="176" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="240" y="77.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Measure</text><text x="240" y="95.5" font-size="13" fill="#4d4d4d" text-anchor="start">Scope, logic analyzer,</text><text x="240" y="112.0" font-size="13" fill="#4d4d4d" text-anchor="start">logs, test data</text><path d="M406 90 L428 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="446" y="30" font-size="12" font-weight="700" fill="#3d6fa5" text-anchor="start">03</text><rect x="432" y="42" width="176" height="96" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="446" y="77.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Isolate</text><text x="446" y="95.5" font-size="13" fill="#4d4d4d" text-anchor="start">One cause at a time;</text><text x="446" y="112.0" font-size="13" fill="#4d4d4d" text-anchor="start">mark what is confirmed</text><path d="M612 90 L634 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="652" y="30" font-size="12" font-weight="700" fill="#3d6fa5" text-anchor="start">04</text><rect x="638" y="42" width="176" height="96" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="652" y="77.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Fix</text><text x="652" y="95.5" font-size="13" fill="#4d4d4d" text-anchor="start">Change one thing, re-run</text><text x="652" y="112.0" font-size="13" fill="#4d4d4d" text-anchor="start">the same test</text><path d="M818 90 L840 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="858" y="30" font-size="12" font-weight="700" fill="#3d6fa5" text-anchor="start">05</text><rect x="844" y="42" width="176" height="96" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="858" y="77.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Lock it in</text><text x="858" y="95.5" font-size="13" fill="#4d4d4d" text-anchor="start">Add a check so it</text><text x="858" y="112.0" font-size="13" fill="#4d4d4d" text-anchor="start">stays fixed</text><path d="M932 142 L932 176 L108 176 L108 146" fill="none" stroke="#4d8a3f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_good)"/><text x="520" y="200" font-size="13" font-weight="400" fill="#4d8a3f" text-anchor="middle">Every new build or firmware version runs the same checks again</text></svg>