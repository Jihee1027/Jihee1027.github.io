<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 292" width="1040" height="292" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif"><title id="t">Trigger-board resets and undetected cells</title><desc id="d">A dip in supply voltage reset the trigger board, and cells already moving through the line lost their inspection result, so an affected cell could pass without inspection. After the firmware update every cell affected by a reset is marked NG.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker></defs><rect width="1040" height="292" fill="#ffffff"/><rect x="24" y="40" width="220" height="88" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="71.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Supply voltage dips</text><text x="38" y="89.5" font-size="13" fill="#4d4d4d" text-anchor="start">Found by tracing the</text><text x="38" y="106.0" font-size="13" fill="#4d4d4d" text-anchor="start">resets back to power</text><path d="M248 84 L270 84" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="274" y="40" width="220" height="88" rx="7" fill="#f8cecc" stroke="#b85450" stroke-width="1.2"/><text x="288" y="71.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Trigger board resets</text><text x="288" y="89.5" font-size="13" fill="#4d4d4d" text-anchor="start">Inspection timing</text><text x="288" y="106.0" font-size="13" fill="#4d4d4d" text-anchor="start">is lost for a moment</text><path d="M498 84 L520 84" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="524" y="40" width="220" height="88" rx="7" fill="#f8cecc" stroke="#b85450" stroke-width="1.2"/><text x="538" y="71.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Cells in flight</text><text x="538" y="89.5" font-size="13" fill="#4d4d4d" text-anchor="start">Lose their inspection</text><text x="538" y="106.0" font-size="13" fill="#4d4d4d" text-anchor="start">result</text><text x="24" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What happened</text><text x="774" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Outcome</text><rect x="774" y="40" width="242" height="88" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="788" y="71.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Before</text><text x="788" y="89.5" font-size="13" fill="#4d4d4d" text-anchor="start">An affected cell could</text><text x="788" y="106.0" font-size="13" fill="#4d4d4d" text-anchor="start">pass without inspection</text><rect x="774" y="150" width="242" height="88" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="788" y="181.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">After my firmware update</text><text x="788" y="199.5" font-size="13" fill="#4d4d4d" text-anchor="start">Every cell affected by a</text><text x="788" y="216.0" font-size="13" fill="#4d4d4d" text-anchor="start">reset is marked NG</text><path d="M748 84 L770 84" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M584 128 L584 194 L770 194" fill="none" stroke="#4d8a3f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_good)"/><text x="24" y="272" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Root cause and fix from my Vision Engineering internship. Thresholds, line names and counts are left out.</text></svg>