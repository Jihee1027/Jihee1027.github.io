<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif"><title id="t">Three separate causes behind the controller dropouts</title><desc id="d">Symptom: controller input drops out or the player drifts down. Cause 1: no receive path on the hub; the FPGA keeps only exact 12-byte frames; fixed by adding an AI-assisted receiver, flashed and tested. Cause 2: joystick Y on an ADC2 pin, which fails while Wi-Fi is on, so a failed read looks like down; fix is to move to an ADC1 pin; still open and not confirmed. Cause 3: ESP-NOW broadcast has no acknowledgment or retry; fixed with a 200 ms timeout that releases a silent controller.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker></defs><rect width="1040" height="440" fill="#ffffff"/><rect x="24" y="24" width="992" height="52" rx="7" fill="#f8cecc" stroke="#b85450" stroke-width="1.2"/><text x="38" y="54.0" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Symptom: the controller input drops out, or the player drifts down on its own</text><text x="24" y="104" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Cause</text><text x="300" y="104" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Evidence</text><text x="576" y="104" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Fix</text><text x="852" y="104" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Status</text><rect x="24" y="116" width="250" height="88" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="147.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">No receive path on the hub</text><text x="38" y="165.5" font-size="13" fill="#4d4d4d" text-anchor="start">The hub only sent a</text><text x="38" y="182.0" font-size="13" fill="#4d4d4d" text-anchor="start">test pattern</text><rect x="300" y="116" width="250" height="88" rx="7" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="314" y="147.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Read hub and FPGA code</text><text x="314" y="165.5" font-size="13" fill="#4d4d4d" text-anchor="start">FPGA keeps only exact 12-byte</text><text x="314" y="182.0" font-size="13" fill="#4d4d4d" text-anchor="start">frames; an old stub sent 1 byte</text><rect x="576" y="116" width="250" height="88" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="590" y="147.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Receiver added (AI-assisted)</text><text x="590" y="165.5" font-size="13" fill="#4d4d4d" text-anchor="start">Flashed and tested</text><text x="590" y="182.0" font-size="13" fill="#4d4d4d" text-anchor="start">on the boards</text><rect x="852" y="116" width="164" height="88" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="866" y="147.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Fixed</text><text x="866" y="165.5" font-size="13" fill="#4d4d4d" text-anchor="start">Joystick moves on</text><text x="866" y="182.0" font-size="13" fill="#4d4d4d" text-anchor="start">the HDMI image</text><path d="M278 160 L296 160" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M554 160 L572 160" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M830 160 L848 160" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="220" width="250" height="88" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="259.8" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Joystick Y on an ADC2 pin</text><text x="38" y="277.8" font-size="13" fill="#4d4d4d" text-anchor="start">ESP32-S2, GPIO11</text><rect x="300" y="220" width="250" height="88" rx="7" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="314" y="251.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">ADC2 fails while Wi-Fi is on</text><text x="314" y="269.5" font-size="13" fill="#4d4d4d" text-anchor="start">A failed read gives Y = 0,</text><text x="314" y="286.0" font-size="13" fill="#4d4d4d" text-anchor="start">which the hub reads as down</text><rect x="576" y="220" width="250" height="88" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="590" y="251.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Move Y to an ADC1 pin</text><text x="590" y="269.5" font-size="13" fill="#4d4d4d" text-anchor="start">Then re-test drift</text><text x="590" y="286.0" font-size="13" fill="#4d4d4d" text-anchor="start">with Wi-Fi on</text><rect x="852" y="220" width="164" height="88" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="866" y="251.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Open</text><text x="866" y="269.5" font-size="13" fill="#4d4d4d" text-anchor="start">Likely cause,</text><text x="866" y="286.0" font-size="13" fill="#4d4d4d" text-anchor="start">not yet confirmed</text><path d="M278 264 L296 264" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M554 264 L572 264" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M830 264 L848 264" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="324" width="250" height="88" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="355.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">No lost-packet handling</text><text x="38" y="373.5" font-size="13" fill="#4d4d4d" text-anchor="start">Broadcast has no ACK</text><text x="38" y="390.0" font-size="13" fill="#4d4d4d" text-anchor="start">and no retry</text><rect x="300" y="324" width="250" height="88" rx="7" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="314" y="355.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">A lost packet is just gone</text><text x="314" y="373.5" font-size="13" fill="#4d4d4d" text-anchor="start">The last input stays</text><text x="314" y="390.0" font-size="13" fill="#4d4d4d" text-anchor="start">held on screen</text><rect x="576" y="324" width="250" height="88" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="590" y="355.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">200 ms timeout</text><text x="590" y="373.5" font-size="13" fill="#4d4d4d" text-anchor="start">A silent controller is</text><text x="590" y="390.0" font-size="13" fill="#4d4d4d" text-anchor="start">marked released</text><rect x="852" y="324" width="164" height="88" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="866" y="355.5" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Fixed</text><text x="866" y="373.5" font-size="13" fill="#4d4d4d" text-anchor="start">Stale input clears</text><text x="866" y="390.0" font-size="13" fill="#4d4d4d" text-anchor="start">on its own</text><path d="M278 368 L296 368" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M554 368 L572 368" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M830 368 L848 368" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/></svg>