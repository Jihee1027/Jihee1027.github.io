<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 592" width="1040" height="592" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Airflow duct cover: the trade-off and the fix</title><desc id="d">A moisture problem led to more airflow, which made tabs flutter and fold. A duct cover keeps air off the tab zone while the bottom opening preserves the airflow needed for humidity control. Two abstract sketches compare before and after.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="30" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Moisture problem</text><text x="38" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Humidity near the electrode</text><text x="38" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">had to come down</text><rect x="280" y="30" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="294" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="294" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">More airflow</text><text x="294" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Damper opened further to</text><text x="294" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">dry the area</text><rect x="536" y="30" width="224" height="96" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="550" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="550" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Side effect</text><text x="550" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">On newer lines, too much air</text><text x="550" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">reached the tab zone</text><rect x="792" y="30" width="224" height="96" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="806" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="806" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Duct cover</text><text x="806" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Keeps air off the tab zone,</text><text x="806" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">lower opening kept for airflow</text><path d="M252 78 L276 78" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M508 78 L532 78" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M764 78 L788 78" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="24" y="164" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Concept sketch, not to scale</text><rect stroke-dasharray="6 5" x="24" y="180" width="488" height="262" rx="9" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="42" y="208" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Before: air reaches the tab zone</text><rect x="48" y="234" width="62" height="176" rx="5" fill="#e6e6e6" stroke="#333333" stroke-width="1.3"/><text x="79" y="326" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Duct</text><rect x="214" y="234" width="270" height="86" rx="0" fill="#ffe6cc" stroke="none" stroke-width="1"/><rect x="214" y="320" width="270" height="90" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="214" y="234" width="270" height="176" rx="4" fill="none" stroke="#333333" stroke-width="1.3"/><line x1="214" y1="320" x2="484" y2="320" stroke="#333333" stroke-width="1.1" stroke-dasharray="4 4"/><text x="226" y="252" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Tab zone</text><text x="226" y="338" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Bottom zone</text><rect x="248" y="268" width="13" height="30" rx="2" fill="#c47f00" opacity="1" transform="rotate(-28 254.5 298)"/><rect x="288" y="268" width="13" height="30" rx="2" fill="#c47f00" opacity="1" transform="rotate(26 294.5 298)"/><rect x="328" y="268" width="13" height="30" rx="2" fill="#c47f00" opacity="1" transform="rotate(-28 334.5 298)"/><rect x="368" y="268" width="13" height="30" rx="2" fill="#c47f00" opacity="1" transform="rotate(26 374.5 298)"/><rect x="408" y="268" width="13" height="30" rx="2" fill="#c47f00" opacity="1" transform="rotate(-28 414.5 298)"/><rect x="448" y="268" width="13" height="30" rx="2" fill="#c47f00" opacity="1" transform="rotate(26 454.5 298)"/><path d="M114 260 L208 260" fill="none" stroke="#c47f00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_rust)"/><path d="M114 288 L208 288" fill="none" stroke="#c47f00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_rust)"/><path d="M114 346 L208 346" fill="none" stroke="#3d6fa5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M114 378 L208 378" fill="none" stroke="#3d6fa5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><text x="349" y="432" font-size="12.5" font-weight="700" fill="#c47f00" text-anchor="middle">Tabs fold and flutter</text><rect stroke-dasharray="6 5" x="528" y="180" width="488" height="262" rx="9" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="546" y="208" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">After: cover on the tab zone, bottom open</text><rect x="552" y="234" width="62" height="176" rx="5" fill="#e6e6e6" stroke="#333333" stroke-width="1.3"/><text x="583" y="326" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Duct</text><rect x="718" y="234" width="270" height="86" rx="0" fill="#d5e8d4" stroke="none" stroke-width="1"/><rect x="718" y="320" width="270" height="90" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="718" y="234" width="270" height="176" rx="4" fill="none" stroke="#333333" stroke-width="1.3"/><line x1="718" y1="320" x2="988" y2="320" stroke="#333333" stroke-width="1.1" stroke-dasharray="4 4"/><text x="730" y="252" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Tab zone</text><text x="730" y="338" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Bottom zone</text><rect x="752" y="268" width="13" height="30" rx="2" fill="#1a1a1a" opacity="0.85" transform="rotate(0 758.5 298)"/><rect x="792" y="268" width="13" height="30" rx="2" fill="#1a1a1a" opacity="0.85" transform="rotate(0 798.5 298)"/><rect x="832" y="268" width="13" height="30" rx="2" fill="#1a1a1a" opacity="0.85" transform="rotate(0 838.5 298)"/><rect x="872" y="268" width="13" height="30" rx="2" fill="#1a1a1a" opacity="0.85" transform="rotate(0 878.5 298)"/><rect x="912" y="268" width="13" height="30" rx="2" fill="#1a1a1a" opacity="0.85" transform="rotate(0 918.5 298)"/><rect x="952" y="268" width="13" height="30" rx="2" fill="#1a1a1a" opacity="0.85" transform="rotate(0 958.5 298)"/><rect x="646" y="230" width="12" height="92" rx="2" fill="#4d8a3f" stroke="none" stroke-width="1"/><text x="652" y="224" font-size="12" font-weight="700" fill="#4d8a3f" text-anchor="middle">Cover</text><path d="M618 346 L712 346" fill="none" stroke="#3d6fa5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M618 378 L712 378" fill="none" stroke="#3d6fa5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><text x="638" y="298" font-size="1" font-weight="400" fill="#1a1a1a" text-anchor="start"></text><text x="853" y="432" font-size="12.5" font-weight="700" fill="#4d8a3f" text-anchor="middle">Tabs stay flat</text><rect x="24" y="462" width="992" height="70" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="38" y="494.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Result</text><text x="38" y="510.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Tab flutter dropped sharply after installation while the lower opening preserved the airflow needed for humidity control.</text><rect x="24" y="562" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="574" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="562" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="138.672" y="574" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="262.703125" y="562" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="292.703" y="574" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>