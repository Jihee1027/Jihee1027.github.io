<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" width="1040" height="372" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">What this project shows for process integration</title><desc id="d">Three rows. The simulator passed but Quartus built about 131,000 flip-flops from one connection: find what the first check misses, and add an automatic check. The routed PCB file was measured and showed one I2S trace twice as long as the others: trust data, not appearance. The controller signal drops have three separate causes, one not yet confirmed: separate causes and mark what is confirmed.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What happened</text><text x="370" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">The habit</text><text x="716" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Where process integration uses it</text><rect x="24" y="44" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Sim passed, Quartus did not</text><text x="38" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">One connection became about</text><text x="38" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">131,000 flip-flops</text><rect x="370" y="44" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Catch what checks miss</text><text x="384" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Found the cause, added an</text><text x="384" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">automatic check</text><rect x="716" y="44" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Prevent recurrence</text><text x="730" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix the cause and add a</text><text x="730" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">check so it stays fixed</text><path d="M328 90 L366 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 90 L712 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="152" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Measured the routed PCB</text><text x="38" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">I2S line 150 mm, the</text><text x="38" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">other two 80 mm</text><rect x="370" y="152" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Data, not looks</text><text x="384" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">The picture looked fine;</text><text x="384" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">the file said otherwise</text><rect x="716" y="152" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Trust measurements</text><text x="730" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Decide from numbers</text><text x="730" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">not appearance</text><path d="M328 198 L366 198" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 198 L712 198" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="260" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Controller signal drops</text><text x="38" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Three separate causes,</text><text x="38" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">one not yet confirmed</text><rect x="370" y="260" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Separate the causes</text><text x="384" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Mark what is confirmed</text><text x="384" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">and what is not</text><rect x="716" y="260" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Root cause and status</text><text x="730" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Do not fix one cause</text><text x="730" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">and claim all three</text><path d="M328 306 L366 306" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 306 L712 306" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/></svg>