<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Five-stage RISC-V pipeline with forwarding and hazard handling</title><desc id="d">Fetch, decode, execute, memory and write-back stages separated by pipeline registers. A forwarding unit feeds operands to execute, a hazard unit stalls or flushes, and branch control redirects the program counter.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="84" width="148" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="110.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">IF</text><text x="38" y="127.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Fetch</text><text x="38" y="144.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">PC, instruction</text><text x="38" y="160.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">memory</text><rect x="235" y="84" width="148" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="249" y="110.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">ID</text><text x="249" y="127.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Decode</text><text x="249" y="144.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Register file,</text><text x="249" y="160.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">control</text><rect x="446" y="84" width="148" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="460" y="118.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">EX</text><text x="460" y="135.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Execute</text><text x="460" y="152.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">ALU</text><rect x="657" y="84" width="148" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="671" y="118.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">MEM</text><text x="671" y="135.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Memory</text><text x="671" y="152.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Data memory</text><rect x="868" y="84" width="148" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="882" y="110.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">WB</text><text x="882" y="127.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Write back</text><text x="882" y="144.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Result to</text><text x="882" y="160.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">register file</text><rect x="198.5" y="64" width="10" height="136" rx="2" fill="#c5d8f0" stroke="#3d6fa5" stroke-width="1.2"/><text x="203.5" y="56" font-size="11" font-weight="700" fill="#3d6fa5" text-anchor="middle">IF/ID</text><path d="M175 132 L196.5 132" fill="none" stroke="#333333" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M210.5 132 L232 132" fill="none" stroke="#333333" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="409.5" y="64" width="10" height="136" rx="2" fill="#c5d8f0" stroke="#3d6fa5" stroke-width="1.2"/><text x="414.5" y="56" font-size="11" font-weight="700" fill="#3d6fa5" text-anchor="middle">ID/EX</text><path d="M386 132 L407.5 132" fill="none" stroke="#333333" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M421.5 132 L443 132" fill="none" stroke="#333333" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="620.5" y="64" width="10" height="136" rx="2" fill="#c5d8f0" stroke="#3d6fa5" stroke-width="1.2"/><text x="625.5" y="56" font-size="11" font-weight="700" fill="#3d6fa5" text-anchor="middle">EX/MEM</text><path d="M597 132 L618.5 132" fill="none" stroke="#333333" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M632.5 132 L654 132" fill="none" stroke="#333333" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="831.5" y="64" width="10" height="136" rx="2" fill="#c5d8f0" stroke="#3d6fa5" stroke-width="1.2"/><text x="836.5" y="56" font-size="11" font-weight="700" fill="#3d6fa5" text-anchor="middle">MEM/WB</text><path d="M808 132 L829.5 132" fill="none" stroke="#333333" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M843.5 132 L865 132" fill="none" stroke="#333333" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M520 80 L520 30 L98 30 L98 80" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_rust)"/><text x="110" y="22" font-size="12" font-weight="400" fill="#c47f00" text-anchor="start" font-style="italic">Branch control: redirect the PC, flush wrong-path instructions</text><rect x="100" y="300" width="200" height="62" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="114" y="328.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Hazard unit</text><text x="114" y="345.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Stall and flush</text><path d="M203.5 298 L203.5 204" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M302 331 L414.5 331 L414.5 204" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><text x="213.5" y="262" font-size="12" font-weight="400" fill="#3d6fa5" text-anchor="start" font-style="italic">stall / flush</text><rect x="560" y="300" width="200" height="62" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="574" y="328.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Forwarding unit</text><text x="574" y="345.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Bypass, no wait for write-back</text><path d="M625.5 202 L625.5 296" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M836.5 202 L836.5 252 L700 252 L700 296" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M558 331 L520 331 L520 184" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><text x="512" y="262" font-size="12" font-weight="400" fill="#3d6fa5" text-anchor="end" font-style="italic">forwarded</text><text x="512" y="277" font-size="12" font-weight="400" fill="#3d6fa5" text-anchor="end" font-style="italic">operands</text><rect stroke-dasharray="5 4" x="24" y="396" width="992" height="46" rx="7" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="44" y="424" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Single-cycle version verified. Forwarding and hazard units designed and tested (Lab 6); full integration is Lab 7.</text></svg>