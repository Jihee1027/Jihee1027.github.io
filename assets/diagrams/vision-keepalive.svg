<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Keeping the service running</title><desc id="d">Windows Task Scheduler starts a supervisor, the supervisor respawns a watchdog, and the watchdog restarts the application whenever it exits.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="36" width="224" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="64.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="81.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Task Scheduler</text><text x="38" y="98.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">At logon, and every minute</text><text x="38" y="114.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">as a safety net</text><path d="M252 86 L276 86" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="280" y="36" width="224" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="294" y="64.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="294" y="81.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Supervisor</text><text x="294" y="98.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Checks every 5 seconds,</text><text x="294" y="114.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">respawns the watchdog</text><path d="M508 86 L532 86" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="536" y="36" width="224" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="550" y="64.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="550" y="81.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Watchdog</text><text x="550" y="98.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Restarts the app 5 s</text><text x="550" y="114.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">after it exits</text><path d="M764 86 L788 86" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="792" y="36" width="224" height="100" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="806" y="64.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="806" y="81.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Application</text><text x="806" y="98.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">60-second task loop</text><text x="806" y="114.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">and upload server</text><rect x="24" y="180" width="488" height="76" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="38" y="215.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Interactive session on purpose</text><text x="38" y="231.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The app drives a desktop UI, so it must run while a user is logged on.</text><rect x="528" y="180" width="488" height="76" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="542" y="215.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Clean stop</text><text x="542" y="231.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">A stop file ends each loop, so a deliberate shutdown does not trigger a restart.</text></svg>