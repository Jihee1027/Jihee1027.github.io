<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 576" width="1040" height="576" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Where variation shows up versus where it starts</title><desc id="d">A four-stage manufacturing flow with the likely origin of variation marked upstream and the visible symptom marked at inspection, plus the evidence and steps used to connect them.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="30" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">The line</text><rect x="24" y="44" width="200" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="75.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Upstream handling</text><text x="38" y="92.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Material path /</text><text x="38" y="108.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">web alignment</text><rect x="288" y="44" width="200" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="302" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Laser processing</text><text x="302" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Notching</text><rect x="552" y="44" width="200" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="566" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">In-process inspection</text><text x="566" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Vision footage, alarms</text><rect x="816" y="44" width="200" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="830" y="75.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Downstream handling</text><text x="830" y="92.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Feeds the next</text><text x="830" y="108.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">manufacturing step</text><path d="M230 86 L282 86" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M494 86 L546 86" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M758 86 L810 86" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="168" width="260" height="76" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="38" y="195.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Where it may start</text><text x="38" y="212.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">A shift in the material path or</text><text x="38" y="228.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">web alignment, for example</text><path d="M124 134 L124 164" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_rust)"/><rect x="522" y="168" width="260" height="76" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="536" y="195.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Where it shows up</text><text x="536" y="212.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">A miscut or breakage alarm,</text><text x="536" y="228.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">at the point the line stops</text><path d="M652 134 L652 164" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M290 206 L516 206" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_rust)"/><text x="403" y="196" font-size="12" font-weight="400" fill="#c47f00" text-anchor="middle" font-style="italic">variation travels with the material</text><rect x="816" y="168" width="200" height="76" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="830" y="195.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Quality review</text><text x="830" y="211.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Evaluation and feedback,</text><text x="830" y="227.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">not a process step</text><path d="M916 134 L916 164" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_mute)"/><path d="M812 206 L786 206" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_mute)"/><text x="24" y="282" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What I used to tell the two apart</text><rect x="24" y="296" width="230" height="46" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="139" y="324.28" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Alarm timing</text><rect x="278" y="296" width="230" height="46" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="393" y="324.28" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Line history</text><rect x="532" y="296" width="230" height="46" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="647" y="324.28" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Defect images, vision footage</text><rect x="786" y="296" width="230" height="46" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="901" y="324.28" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Conditions before and after</text><text x="24" y="386" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">How the investigation ran</text><rect x="24" y="400" width="214" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="428.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="445.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Recurring signature</text><text x="38" y="462.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Same miscut or breakage</text><text x="38" y="478.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">pattern, not a one off</text><path d="M243 450 L278.3 450" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="283.3" y="400" width="214" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="297.3" y="428.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="297.3" y="445.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Time and location</text><text x="297.3" y="462.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Alarm timing set against</text><text x="297.3" y="478.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">the line history</text><path d="M502.3 450 L537.7 450" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="542.7" y="400" width="214" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="556.7" y="428.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="556.7" y="445.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Hypothesis</text><text x="556.7" y="462.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Process, equipment,</text><text x="556.7" y="478.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">or material</text><path d="M761.7 450 L797 450" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="802" y="400" width="214" height="100" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="816" y="428.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="816" y="445.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Verify after action</text><text x="816" y="462.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Expected response appears</text><text x="816" y="478.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">and stays</text><rect x="24" y="546" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="558" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="546" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="138.672" y="558" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="262.703125" y="546" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="292.703" y="558" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>