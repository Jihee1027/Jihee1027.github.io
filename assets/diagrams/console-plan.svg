<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" width="1040" height="370" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">RetroCore status in six parts</title><desc id="d">Tools and board bring-up are done. The FPGA SoC passes simulation. The controller link works but the signal still drops. The add-on PCB Rev A is routed with zero DRC errors and awaits review. Timing closure at 100.78 MHz is open, with a setup slack of minus 0.306 nanoseconds. Integration, enclosure and the final demo come next.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Where each part stands, late October 2026</text><rect x="24" y="48" width="296" height="130" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="38" y="90.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">DONE</text><text x="38" y="109.15" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Tools + board bring-up</text><text x="38" y="126.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">DE10-Nano flow works:</text><text x="38" y="143.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">JTAG, LED test, Questa sim</text><rect x="372" y="48" width="296" height="130" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="386" y="90.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">SIM PASS</text><text x="386" y="109.15" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">FPGA SoC</text><text x="386" y="126.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Graphics, audio, SPI, RISC-V core.</text><text x="386" y="143.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">soc_core.sim: 35 pass, 0 fail</text><rect x="720" y="48" width="296" height="130" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="734" y="90.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">WORKS, STILL DROPS</text><text x="734" y="109.15" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Controller link</text><text x="734" y="126.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">ESP-NOW to hub to FPGA over SPI;</text><text x="734" y="143.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">joystick moves on HDMI</text><rect x="24" y="218" width="296" height="130" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="38" y="260.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">ROUTED</text><text x="38" y="279.15" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Add-on PCB, Rev A</text><text x="38" y="296.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">KiCad, DRC 0 errors.</text><text x="38" y="313.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Staff review before ordering</text><rect x="372" y="218" width="296" height="130" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="386" y="260.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">OPEN</text><text x="386" y="279.15" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Timing closure</text><text x="386" y="296.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">100.78 MHz clock,</text><text x="386" y="313.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">setup slack -0.306 ns</text><rect x="720" y="218" width="296" height="130" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="734" y="260.32" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">NEXT</text><text x="734" y="279.15" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Integrate and demo</text><text x="734" y="296.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">System tests, I2S audio,</text><text x="734" y="313.69" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start">enclosure, final demo</text></svg>