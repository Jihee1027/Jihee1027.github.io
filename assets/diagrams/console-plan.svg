<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">RetroCore hardware plan in six stages</title><desc id="d">Stage 1, FPGA tools and board bring-up, is done. Stages 2 to 6 cover video output, one controller over SPI, integration with the RISC-V game logic, power, PCB, audio and enclosure, and full system tests.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Current hardware implementation plan</text><rect x="24" y="48" width="296" height="130" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="38" y="92.34" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">STAGE 1 · DONE</text><text x="38" y="109.26" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Tools and bring-up</text><text x="38" y="125.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">DE10-Nano, Quartus and Questa working;</text><text x="38" y="140.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">first design programmed over JTAG</text><rect x="372" y="48" width="296" height="130" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="386" y="92.34" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">STAGE 2</text><text x="386" y="109.26" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Video timing and HDMI</text><text x="386" y="125.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Counters and sync signals, then</text><text x="386" y="140.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">a stable test image on the display</text><rect x="720" y="48" width="296" height="130" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="734" y="92.34" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">STAGE 3</text><text x="734" y="109.26" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">One controller over SPI</text><text x="734" y="125.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">ESP32 reads a joystick and buttons;</text><text x="734" y="140.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">FPGA receives the state</text><rect x="24" y="218" width="296" height="130" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="262.34" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">STAGE 4</text><text x="38" y="279.26" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Integrate</text><text x="38" y="295.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Display, controller input and the</text><text x="38" y="310.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">RISC-V game logic together</text><rect x="372" y="218" width="296" height="130" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="386" y="262.34" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">STAGE 5</text><text x="386" y="279.26" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Power, PCB, audio, enclosure</text><text x="386" y="295.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Regulation, custom board, sound,</text><text x="386" y="310.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">second control station</text><rect x="720" y="218" width="296" height="130" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="734" y="262.34" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">STAGE 6</text><text x="734" y="279.26" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">System tests and demo</text><text x="734" y="295.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Full tests, integration fixes,</text><text x="734" y="310.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">final demonstration</text><path d="M323 113 L369 113" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M671 113 L717 113" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M868 180 L868 200 L172 200 L172 215" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_mute)"/><path d="M323 283 L369 283" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M671 283 L717 283" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="24" y="388" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">Each block gets its own testbench and waveform check before it joins the full system.</text></svg>