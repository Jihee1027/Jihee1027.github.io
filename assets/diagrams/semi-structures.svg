<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 230" width="1040" height="230" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Three transistor structures</title><desc id="d">Planar MOSFET, FinFET and gate-all-around, left to right. Planar: gate on a flat channel, short channels lose gate control and leakage rises. FinFET: the gate wraps three sides of a thin fin. Gate-all-around: the gate wraps stacked nanosheets or nanowires on every side, with a harder flow.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Gate control over the channel increases</text><rect x="24" y="44" width="296" height="160" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="94.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="111.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Planar MOSFET</text><text x="38" y="128.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Gate on top of a flat channel.</text><text x="38" y="144.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Short channels lose gate control,</text><text x="38" y="160.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">so leakage rises.</text><rect x="372" y="44" width="296" height="160" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="386" y="94.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="386" y="111.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">FinFET</text><text x="386" y="128.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Gate wraps three sides of a thin fin.</text><text x="386" y="144.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">More of the channel is controlled.</text><text x="386" y="160.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Fin width and height now matter.</text><rect x="720" y="44" width="296" height="160" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="734" y="86.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="734" y="103.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Gate-all-around</text><text x="734" y="120.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Gate wraps stacked nanosheets or</text><text x="734" y="136.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">nanowires on every side. Harder flow:</text><text x="734" y="152.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">alternating layers, then selective</text><text x="734" y="168.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">removal of the sacrificial ones.</text><path d="M324 124 L368 124" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M672 124 L716 124" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/></svg>