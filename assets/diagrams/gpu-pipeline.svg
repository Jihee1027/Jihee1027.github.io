<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 352" width="1040" height="352" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Fixed-point GPU vertex stage</title><desc id="d">A vertex passes through matrix-vector multiplication, perspective division and screen-space conversion, each an independent module with a fixed-point interface.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="30" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Data path</text><rect x="24" y="50" width="120" height="112" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="38" y="95.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Vertex in</text><text x="38" y="111.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Fixed-point</text><text x="38" y="127.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">x, y, z, w</text><rect x="175" y="50" width="210" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="189" y="84.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Module 1</text><text x="189" y="101.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Matrix-vector multiply</text><text x="189" y="118.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Transform the vertex</text><text x="189" y="134.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">by the matrix</text><rect x="415" y="50" width="210" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="429" y="84.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Module 2</text><text x="429" y="101.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Perspective division</text><text x="429" y="118.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Divide by w,</text><text x="429" y="134.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">divider integrated</text><rect x="655" y="50" width="210" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="669" y="84.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Module 3</text><text x="669" y="101.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Screen-space conversion</text><text x="669" y="118.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Normalized coordinates</text><text x="669" y="134.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">to screen position</text><rect x="895" y="50" width="121" height="112" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="909" y="95.12" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">Screen coords</text><text x="909" y="111.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Ready for the</text><text x="909" y="127.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">next stage</text><path d="M148 106 L171 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M389 106 L411 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M629 106 L651 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M869 106 L891 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><line x1="175" y1="190" x2="865" y2="190" stroke="#4d4d4d" stroke-width="1.2"/><line x1="175" y1="184" x2="175" y2="196" stroke="#4d4d4d" stroke-width="1.2"/><line x1="865" y1="184" x2="865" y2="196" stroke="#4d4d4d" stroke-width="1.2"/><text x="520" y="214" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle" font-style="italic">Three independent modules, each with a fixed-point interface</text><text x="24" y="262" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What I had to balance</text><rect x="24" y="276" width="230" height="52" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="139" y="307.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Numerical precision</text><rect x="278" y="276" width="230" height="52" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="393" y="307.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">FPGA resource usage</text><rect x="532" y="276" width="230" height="52" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="647" y="307.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Clock frequency</text><rect x="786" y="276" width="230" height="52" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="901" y="307.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pipeline throughput</text></svg>