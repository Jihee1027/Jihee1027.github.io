<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" width="1040" height="570" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Fixed-point GPU vertex stage</title><desc id="d">A vertex passes through three pipelined RTL modules with fixed-point interfaces: matrix-vector multiplication, perspective division and a screen-space transform that outputs screen X and Y plus depth. Below, the perspective-division block: a pipelined reciprocal of w, X, Y and Z delayed to align with it, three parallel multiplies, then scaling and saturation to 24 bits, with a divide-by-zero case.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="30" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Vertex stage data path</text><rect x="24" y="50" width="120" height="112" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="38" y="95.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Vertex in</text><text x="38" y="111.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Fixed-point</text><text x="38" y="127.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">x, y, z, w</text><rect x="175" y="50" width="210" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="189" y="84.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Module 1</text><text x="189" y="101.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Matrix-vector multiply</text><text x="189" y="118.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">4x4 model-view-projection</text><text x="189" y="134.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">transform</text><rect x="415" y="50" width="210" height="112" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="429" y="84.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Module 2</text><text x="429" y="101.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Perspective division</text><text x="429" y="118.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Reciprocal of w, then</text><text x="429" y="134.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">x, y, z times 1/w</text><rect x="655" y="50" width="210" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="669" y="84.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Module 3</text><text x="669" y="101.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Screen-space transform</text><text x="669" y="118.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">NDC to pixel coordinates,</text><text x="669" y="134.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Y flip, clamp</text><rect x="895" y="50" width="121" height="112" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="909" y="95.62" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">Screen X/Y</text><text x="909" y="111.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">plus depth,</text><text x="909" y="126.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">to next stage</text><path d="M148 106 L171 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M389 106 L411 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M629 106 L651 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M869 106 L891 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="175" y="176" width="9" height="9" rx="2" fill="#c47f00" stroke="none" stroke-width="1"/><text x="191" y="185" font-size="12" font-weight="700" fill="#c47f00" text-anchor="start">In progress</text><rect x="415" y="176" width="9" height="9" rx="2" fill="#4d8a3f" stroke="none" stroke-width="1"/><text x="431" y="185" font-size="12" font-weight="700" fill="#4d8a3f" text-anchor="start">Prototype verified in RTL simulation</text><rect x="655" y="176" width="9" height="9" rx="2" fill="#c47f00" stroke="none" stroke-width="1"/><text x="671" y="185" font-size="12" font-weight="700" fill="#c47f00" text-anchor="start">In progress</text><line x1="175" y1="212" x2="865" y2="212" stroke="#4d4d4d" stroke-width="1.2"/><line x1="175" y1="206" x2="175" y2="218" stroke="#4d4d4d" stroke-width="1.2"/><line x1="865" y1="206" x2="865" y2="218" stroke="#4d4d4d" stroke-width="1.2"/><text x="520" y="236" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle" font-style="italic">Three pipelined RTL modules with fixed-point interfaces</text><text x="24" y="276" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Inside the perspective-division block</text><rect x="24" y="292" width="224" height="100" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="38" y="320.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="337.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Reciprocal of w</text><text x="38" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Normalize, lookup, then</text><text x="38" y="370.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Newton-Raphson refinement</text><rect x="280" y="292" width="224" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="294" y="320.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="294" y="337.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Align x, y, z</text><text x="294" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Delayed by the reciprocal</text><text x="294" y="370.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">latency, kept in step</text><rect x="536" y="292" width="224" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="550" y="320.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="550" y="337.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Multiply by 1/w</text><text x="550" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">x, y and z in parallel,</text><text x="550" y="370.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">wide intermediate products</text><rect x="792" y="292" width="224" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="806" y="320.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="806" y="337.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Scale and saturate</text><text x="806" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Back to 24-bit Q16.8,</text><text x="806" y="370.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">clipped to the signed range</text><path d="M136 394 L136 408 L608 408 L608 394" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><text x="300" y="424" font-size="11.5" font-weight="400" fill="#3d6fa5" text-anchor="start" font-style="italic">1/w to the three multipliers</text><path d="M508 342 L532 342" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M764 342 L788 342" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="446" width="488" height="66" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="38" y="476.69" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Divide by zero</text><text x="38" y="492.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Detected on w, and the outputs are forced to zero.</text><rect x="528" y="446" width="488" height="66" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="542" y="476.69" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Targets</text><text x="542" y="492.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">100 MHz, 10M vertices/s, 60 FPS, 24-bit signed Q16.8</text><text x="24" y="540" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">Module 2 accepts one new vertex per clock cycle once its pipeline is full.</text></svg>