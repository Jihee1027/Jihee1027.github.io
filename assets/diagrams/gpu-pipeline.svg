<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" width="1040" height="380" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Vertex stage pipeline with latency and DSP use</title><desc id="d">Seven steps from vertices in to triangles out: input and FIFO 1 cycle, controller 9 cycles, transform 7 cycles with 6 DSP slices, clip reject 1 cycle, perspective divide 7 cycles with 7 DSP slices, screen-space transform 2 cycles with 0 DSP slices, output FIFO 1 cycle. Total 28 cycles and 13 DSP slices.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">A triangle goes in as three vertices and comes out in screen pixels</text><rect x="24" y="50" width="128" height="112" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="38" y="85.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">1 cycle</text><text x="38" y="103.01" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Input + FIFO</text><text x="38" y="118.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">3 vertices,</text><text x="38" y="134.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">1 triangle</text><path d="M154 106 L166 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="168" y="50" width="128" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="182" y="85.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">9 cycles</text><text x="182" y="103.01" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Controller</text><text x="182" y="118.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">1 vertex every</text><text x="182" y="134.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">4 cycles</text><path d="M298 106 L310 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="312" y="50" width="128" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="326" y="85.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">7 cycles</text><text x="326" y="103.01" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Transform</text><text x="326" y="118.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">4x4 matrix,</text><text x="326" y="134.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">row by row</text><path d="M442 106 L454 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="456" y="50" width="128" height="112" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="470" y="85.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">1 cycle</text><text x="470" y="103.01" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Clip</text><text x="470" y="118.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Drop if behind</text><text x="470" y="134.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">the near plane</text><path d="M586 106 L598 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="600" y="50" width="128" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="614" y="85.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">7 cycles</text><text x="614" y="103.01" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Divide by w</text><text x="614" y="118.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">1/w from a table,</text><text x="614" y="134.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">times x, y, z</text><path d="M730 106 L742 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="744" y="50" width="128" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="758" y="85.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">2 cycles</text><text x="758" y="103.01" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Screen space</text><text x="758" y="118.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">NDC to</text><text x="758" y="134.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">640 x 480 pixels</text><path d="M874 106 L886 106" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="888" y="50" width="128" height="112" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="902" y="85.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">1 cycle</text><text x="902" y="103.01" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Output FIFO</text><text x="902" y="118.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">1 triangle</text><text x="902" y="134.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">to rasterizer</text><text x="24" y="196" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">DSP slices used</text><rect x="312" y="210" width="128" height="56" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="376" y="244.08" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">6 DSP</text><rect x="600" y="210" width="128" height="56" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="664" y="244.08" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">7 DSP</text><rect x="744" y="210" width="128" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="808" y="244.08" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">0 DSP</text><rect x="24" y="300" width="992" height="1.5" rx="0" fill="#333333" stroke="none" stroke-width="0"/><text x="24" y="334" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="start">28 cycles</text><text x="160" y="334" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">from the last input vertex to a valid output</text><text x="560" y="334" font-size="26" font-weight="700" fill="#3d6fa5" text-anchor="start">13 DSP slices</text><text x="740" y="334" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">in total (Sprint 3: 40)</text><text x="24" y="364" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">Cycle counts follow the Sprint 4 latency table. Blue marks the clipping stage I added.</text></svg>