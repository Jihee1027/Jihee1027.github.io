<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" width="1040" height="372" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">What this project shows for process integration</title><desc id="d">Three rows. Unit tests passed but the connected CPU hung: trace one signal across stages, like root-causing across process steps. More cycles but a faster clock: judge by total outcome, like trade-offs between steps. Branch predictor cut loop cycles but lowered the clock: report the cost and call it open, like honest status on open issues.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What happened</text><text x="370" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">The habit</text><text x="716" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Where process integration uses it</text><rect x="24" y="44" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Tests pass, system hangs</text><text x="38" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Every unit test passed;</text><text x="38" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">the connected CPU did not stop</text><rect x="370" y="44" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Trace one signal</text><text x="384" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Followed halt across</text><text x="384" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">all five stages</text><rect x="716" y="44" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Cross-step root cause</text><text x="730" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Find where a problem starts,</text><text x="730" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">not where it shows up</text><path d="M328 90 L366 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 90 L712 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="152" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">More cycles, faster clock</text><text x="38" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">1.71 vs 1.28 cycles per</text><text x="38" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">instruction, yet 1.20x to 1.29x faster</text><rect x="370" y="152" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Judge by the total</text><text x="384" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Execution time, not one</text><text x="384" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">metric on its own</text><rect x="716" y="152" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Trade-offs between steps</text><text x="730" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">One gain can cost</text><text x="730" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">something downstream</text><path d="M328 198 L366 198" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 198 L712 198" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="260" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Predictor: 212 to 116 cycles</text><text x="38" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">But the clock limit fell</text><text x="38" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">from 79.1 to 68.6 MHz</text><rect x="370" y="260" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Report the cost</text><text x="384" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Called it open, below the</text><text x="384" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">70 MHz target</text><rect x="716" y="260" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Honest status</text><text x="730" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Say what is not yet</text><text x="730" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">solved</text><path d="M328 306 L366 306" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 306 L712 306" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/></svg>