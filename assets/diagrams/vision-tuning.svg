<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 656" width="1040" height="656" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Tuning an inspection recipe with data</title><desc id="d">The vision program inspects the electrode and logs results. Defect rates by view are read in SPC and Spotfire to find over-detection, where good material is flagged, and missed detection, where real defects pass. The recipe for that view is adjusted and the same data is checked again.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="40" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="66.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Vision program inspects</text><text x="38" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Foil area, CIS and other</text><text x="38" y="116.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">views of the electrode</text><rect x="280" y="40" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="294" y="66.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="294" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Results are logged</text><text x="294" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Judgement and image for</text><text x="294" y="116.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">each inspected part</text><rect x="536" y="40" width="224" height="96" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="550" y="66.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="550" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Read the trend</text><text x="550" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Defect rate by view, in</text><text x="550" y="116.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">SPC and Spotfire</text><path d="M252 88 L276 88" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M508 88 L532 88" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M764 88 L788 88" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="792" y="40" width="224" height="236" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="806" y="58" font-size="10.5" font-weight="700" fill="#3d6fa5" text-anchor="start">04</text><text x="806" y="77" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Two ways to be wrong</text><rect x="806" y="90" width="196" height="84" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="820" y="121.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">False positive</text><text x="820" y="137.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Over-detection:</text><text x="820" y="153.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">good parts flagged</text><rect x="806" y="182" width="196" height="84" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="820" y="213.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">False negative</text><text x="820" y="229.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Missed detection:</text><text x="820" y="245.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">real defects pass</text><path d="M904 280 L904 312" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="792" y="316" width="224" height="96" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="806" y="350.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="806" y="367.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Adjust the recipe</text><text x="806" y="384.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">For the view that drifted</text><rect x="536" y="316" width="224" height="96" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="550" y="342.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06</text><text x="550" y="359.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Check again</text><text x="550" y="376.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Same trend, plus the</text><text x="550" y="392.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">production images</text><path d="M788 364 L764 364" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M532 364 L136 364 L136 140" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_rust)"/><text x="392" y="356" font-size="12" font-weight="400" fill="#c47f00" text-anchor="middle" font-style="italic">Not holding: back to 01</text><rect stroke-dasharray="5 4" x="24" y="440" width="992" height="56" rx="7" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="44" y="464" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Changing an inspection threshold can trade false positives against false negatives.</text><text x="44" y="484" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">I checked both errors against production images before accepting a recipe change.</text><text x="24" y="526" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What the vision-program improvements moved</text><rect x="24" y="538" width="992" height="66" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="44" y="584" font-size="34" font-weight="700" fill="#4d8a3f" text-anchor="start">-10%</text><text x="170" y="567" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">false-positive results</text><text x="170" y="586" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">approximate, after tuning against production data</text><text x="560" y="567" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Both error types checked</text><text x="560" y="586" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">against production images before a change was kept</text><rect x="24" y="626" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="638" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="626" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="138.672" y="638" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Key point</text><rect x="218.6875" y="626" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="248.688" y="638" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="372.71875" y="626" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="402.719" y="638" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>