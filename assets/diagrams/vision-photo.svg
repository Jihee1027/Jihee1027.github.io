<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Image-delivery extension</title><desc id="d">Edge devices upload photos into per-device folders and then trigger a send. The server replies at once and a worker queues the folder once, waits for late uploads, sends it as one batch, archives the files, and re-queues if new files arrived.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="24" font-size="12" font-weight="700" fill="#c47f00" text-anchor="start">Image-delivery extension: in development</text><rect x="20" y="40" width="220" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="34" y="66.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="34" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Edge device</text><text x="34" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Uploads each photo as</text><text x="34" y="116.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">it is taken</text><rect x="272" y="40" width="220" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="286" y="66.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="286" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Upload server</text><text x="286" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Saves into a folder per</text><text x="286" y="116.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">device and job</text><rect x="524" y="40" width="220" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="538" y="66.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="538" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Trigger</text><text x="538" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Device says the batch is</text><text x="538" y="116.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">ready. Server replies OK</text><rect x="776" y="40" width="220" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="790" y="66.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="790" y="83.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Queue the folder</text><text x="790" y="100.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Once per folder. If it is</text><text x="790" y="116.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">busy, mark it pending</text><path d="M244 88 L268 88" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M496 88 L520 88" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M748 88 L772 88" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M886 140 L886 274" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="20" y="278" width="220" height="96" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="34" y="304.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">08</text><text x="34" y="321.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Check for new files</text><text x="34" y="338.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Anything that arrived during</text><text x="34" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">the send?</text><rect x="272" y="278" width="220" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="286" y="304.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">07</text><text x="286" y="321.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Archive</text><text x="286" y="338.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Dated success or fail</text><text x="286" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">folder, plus a history log</text><rect x="524" y="278" width="220" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="538" y="304.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06</text><text x="538" y="321.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Send as one batch</text><text x="538" y="338.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The whole folder in a</text><text x="538" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">single message</text><rect x="776" y="278" width="220" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="790" y="304.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="790" y="321.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Let uploads settle</text><text x="790" y="338.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">A short wait so late files</text><text x="790" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">are included</text><path d="M268 326 L244 326" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M520 326 L496 326" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M772 326 L748 326" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M130 378 L130 430 L1022 430 L1022 88 L1000 88" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_rust)"/><text x="492" y="424" font-size="12" font-weight="400" fill="#c47f00" text-anchor="start" font-style="italic">Yes: queue the folder again</text><text x="24" y="470" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">Design sketch of the extension. It was still in development when I returned to school, so it is not presented as a finished system.</text></svg>