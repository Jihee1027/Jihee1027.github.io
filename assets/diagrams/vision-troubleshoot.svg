<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 646" width="1040" height="646" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Recovering a vision system that is down</title><desc id="d">Restart the vision program, reset the camera, reset the trigger board, reload the recipe, then check the links between the inspection PC, the interface PC, the PLC and the camera grab. A trigger-board reset could lose the inspection association for cells still in flight, leaving that interval uninspected; the affected cells were marked NG. A failure that returns moves to signal-level debugging.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="24" width="460" height="76" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="38" y="59.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Vision system down</text><text x="38" y="76.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">First goal: restore inspection safely and quickly</text><rect x="556" y="24" width="460" height="76" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="570" y="59.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">First: what exactly is failing?</text><text x="570" y="76.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Which camera or view, and what the logs say</text><path d="M486 62 L554 62" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="24" y="134" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Recovery steps, in the order I used them</text><rect x="24" y="150" width="176" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="185.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="200.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Restart the program</text><text x="38" y="216.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Turn the vision</text><text x="38" y="231.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">program off and on</text><rect x="228" y="150" width="176" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="242" y="185.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="242" y="200.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Reset the camera</text><text x="242" y="216.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Clear a stuck</text><text x="242" y="231.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">or drifting camera</text><rect x="432" y="150" width="176" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="446" y="185.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="446" y="200.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Reset trigger board</text><text x="446" y="216.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Restore the trigger</text><text x="446" y="231.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">signals</text><rect x="636" y="150" width="176" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="650" y="185.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="650" y="200.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Reload the recipe</text><text x="650" y="216.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Back to the right</text><text x="650" y="231.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">inspection settings</text><rect x="840" y="150" width="176" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="854" y="185.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="854" y="200.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Check the links</text><text x="854" y="216.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Inspection and interface</text><text x="854" y="231.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">PCs, PLC, camera grab</text><path d="M202 205 L226 205" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M406 205 L430 205" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M610 205 L634 205" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M814 205 L838 205" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M520 262 L520 296 L520 296 L520 336" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_rust)"/><path d="M112 262 L112 296 L184 296 L184 336" fill="none" stroke="#4d8a3f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_good)"/><path d="M928 262 L928 296 L856 296 L856 336" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_rust)"/><text x="196" y="320" font-size="12" font-weight="400" fill="#4d8a3f" text-anchor="start" font-style="italic">Back up and checked</text><rect x="24" y="340" width="320" height="160" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="38" y="401.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Back in production</text><text x="38" y="418.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Check live images and the defect</text><text x="38" y="434.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">data, then log what fixed it</text><text x="38" y="450.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">and when.</text><rect x="360" y="340" width="320" height="160" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="374" y="377.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">The catch in a trigger reset</text><text x="374" y="394.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">A reset could lose the inspection</text><text x="374" y="410.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">association for cells still in flight,</text><text x="374" y="426.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">leaving that interval uninspected.</text><text x="374" y="442.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">I raised it with the vendor, and the</text><text x="374" y="458.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">affected cells were marked NG instead</text><text x="374" y="474.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">of passing without inspection.</text><rect x="696" y="340" width="320" height="160" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="710" y="401.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">If it keeps coming back</text><text x="710" y="418.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Recovery is not root cause. Move to</text><text x="710" y="434.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">signal-level debugging: logs,</text><text x="710" y="450.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">oscilloscope, logic analyzer (next figure).</text><rect stroke-dasharray="5 4" x="24" y="530" width="992" height="50" rx="7" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="44" y="560" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Recovery restores inspection quickly. It does not explain why the failure occurred, and a reset can have a cost of its own.</text><rect x="24" y="616" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="628" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="616" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="138.672" y="628" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Key point</text><rect x="218.6875" y="616" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="248.688" y="628" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="372.71875" y="616" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="402.719" y="628" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>