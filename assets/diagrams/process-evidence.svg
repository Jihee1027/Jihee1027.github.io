<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 386" width="980" height="386" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Five evidence sources read as one chain</title><desc id="d">Process trend, equipment history, inspection evidence, change history and downstream quality feed one evidence chain, which leads to the next test and then verification in production data.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="24" width="250" height="58" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="50.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Process trend</text><text x="38" y="67.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">SPC, breakage, miscut trends</text><line x1="274" y1="53" x2="306" y2="53" stroke="#333333" stroke-width="1.5"/><rect x="24" y="94" width="250" height="58" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="120.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Equipment history</text><text x="38" y="137.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Alarms, downtime, line events</text><line x1="274" y1="123" x2="306" y2="123" stroke="#333333" stroke-width="1.5"/><rect x="24" y="164" width="250" height="58" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="190.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Inspection evidence</text><text x="38" y="207.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Defect images, vision footage</text><line x1="274" y1="193" x2="306" y2="193" stroke="#333333" stroke-width="1.5"/><rect x="24" y="234" width="250" height="58" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="260.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Change history</text><text x="38" y="277.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Recent process, equipment changes</text><line x1="274" y1="263" x2="306" y2="263" stroke="#333333" stroke-width="1.5"/><rect x="24" y="304" width="250" height="58" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="330.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Downstream quality</text><text x="38" y="347.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Assembly and Quality response</text><line x1="274" y1="333" x2="306" y2="333" stroke="#333333" stroke-width="1.5"/><line x1="306" y1="53" x2="306" y2="333" stroke="#333333" stroke-width="1.5"/><path d="M306 193 L346 193" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="350" y="118" width="270" height="150" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="364" y="174.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">One evidence chain</text><text x="364" y="191.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Is this a local symptom</text><text x="364" y="207.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">or a wider process</text><text x="364" y="223.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">interaction?</text><path d="M624 193 L676 193" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="680" y="153" width="276" height="80" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="694" y="182.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Next test or action</text><text x="694" y="199.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Agreed with Process, Equipment,</text><text x="694" y="215.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Production and vendors</text><path d="M818 237 L818 276" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="680" y="280" width="276" height="62" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="694" y="316.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Verified in production data</text></svg>