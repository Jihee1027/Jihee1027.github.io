<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 592" width="1040" height="592" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Mis-threading guard bar</title><desc id="d">A splice step could be threaded the wrong way, causing breakage and quality problems. A guard bar blocks the wrong route so only the correct path is possible.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="30" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">The splice step</text><text x="38" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Semi-automatic splice at the</text><text x="38" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">unloader end</text><rect x="280" y="30" width="224" height="96" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="294" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="294" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Easy to misroute</text><text x="294" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The web sometimes went up over</text><text x="294" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">the roller instead of down</text><rect x="536" y="30" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="550" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="550" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">The cost</text><text x="550" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Breakage and quality issues that</text><text x="550" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">spread downstream</text><rect x="792" y="30" width="224" height="96" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="806" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="806" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Guard bar (poka-yoke)</text><text x="806" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Blocks the upper route so only</text><text x="806" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">the correct path is open</text><path d="M252 78 L276 78" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M508 78 L532 78" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M764 78 L788 78" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="24" y="164" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Concept sketch, not to scale</text><rect stroke-dasharray="6 5" x="24" y="180" width="488" height="262" rx="9" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="42" y="208" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Before: two ways to thread</text><line x1="54" y1="322" x2="194" y2="322" stroke="#8d978f" stroke-width="3"/><line x1="342" y1="322" x2="482" y2="322" stroke="#8d978f" stroke-width="3"/><text x="60" y="310" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">web in</text><text x="476" y="310" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="end">web out</text><path d="M194 322 C224 322 234 380 268 380 C302 380 312 322 342 322" fill="none" stroke="#4d8a3f" stroke-width="3"/><path d="M194 322 C224 322 234 264 268 264 C302 264 312 322 342 322" fill="none" stroke="#c47f00" stroke-width="3" stroke-dasharray="7 6"/><circle cx="268" cy="322" r="38" fill="#e6e6e6" stroke="#333333" stroke-width="1.4"/><circle cx="268" cy="322" r="5" fill="#333333"/><text x="268" y="406" font-size="12.5" font-weight="700" fill="#4d8a3f" text-anchor="middle">correct: down</text><text x="268" y="246" font-size="12.5" font-weight="700" fill="#c47f00" text-anchor="middle">wrong: up</text><text x="268" y="434" font-size="12.5" font-weight="700" fill="#c47f00" text-anchor="middle">Either route is possible</text><rect stroke-dasharray="6 5" x="528" y="180" width="488" height="262" rx="9" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="546" y="208" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">After: the guard closes the upper route</text><line x1="558" y1="322" x2="698" y2="322" stroke="#8d978f" stroke-width="3"/><line x1="846" y1="322" x2="986" y2="322" stroke="#8d978f" stroke-width="3"/><text x="564" y="310" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">web in</text><text x="980" y="310" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="end">web out</text><path d="M698 322 C728 322 738 380 772 380 C806 380 816 322 846 322" fill="none" stroke="#4d8a3f" stroke-width="3"/><path d="M698 322 C728 322 738 264 772 264 C806 264 816 322 846 322" fill="none" stroke="#c47f00" stroke-width="3" stroke-dasharray="7 6"/><circle cx="772" cy="322" r="38" fill="#e6e6e6" stroke="#333333" stroke-width="1.4"/><circle cx="772" cy="322" r="5" fill="#333333"/><text x="772" y="406" font-size="12.5" font-weight="700" fill="#4d8a3f" text-anchor="middle">correct: down</text><text x="772" y="226" font-size="12.5" font-weight="700" fill="#c47f00" text-anchor="middle">wrong: up</text><rect x="720" y="238" width="104" height="12" rx="3" fill="#4d8a3f" stroke="none" stroke-width="1"/><text x="838" y="252" font-size="12" font-weight="700" fill="#4d8a3f" text-anchor="start">Guard bar</text><text x="772" y="434" font-size="12.5" font-weight="700" fill="#4d8a3f" text-anchor="middle">Only the correct route is open</text><rect x="24" y="462" width="992" height="70" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="38" y="494.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Result</text><text x="38" y="510.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Physical error-proofing: the guard makes the correct route the only available route, reducing dependence on operator familiarity or time pressure.</text><rect x="24" y="562" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="574" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="562" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="138.672" y="574" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="262.703125" y="562" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="292.703" y="574" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>