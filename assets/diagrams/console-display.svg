<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Display path from the FPGA to the onboard HDMI transmitter</title><desc id="d">Planned design, not yet implemented or tested. A 50 MHz board clock feeds a PLL that makes a pixel clock of about 25 MHz. Horizontal and vertical counters generate sync and data-enable. A color-bar generator provides a test image. Registered outputs drive the DE10-Nano onboard ADV7513 HDMI transmitter with 24 RGB bits, pixel clock, data enable, HSYNC and VSYNC. The FPGA configures the transmitter over I2C.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Inside the FPGA (planned)</text><rect stroke-dasharray="6 5" x="24" y="44" width="730" height="380" rx="10" fill="none" stroke="#3d6fa5" stroke-width="1.5"/><rect x="44" y="74" width="140" height="76" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="58" y="109.69" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">50 MHz clock</text><text x="58" y="125.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Board oscillator</text><rect x="214" y="74" width="160" height="76" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="228" y="101.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">PLL (planned)</text><text x="228" y="117.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Pixel clock,</text><text x="228" y="133.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">about 25 MHz</text><path d="M187 112 L211 112" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="404" y="74" width="160" height="76" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="418" y="101.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Pixel counters</text><text x="418" y="117.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">H 0 to 799,</text><text x="418" y="133.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">V 0 to 524</text><path d="M377 112 L401 112" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="594" y="74" width="150" height="76" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="608" y="101.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Sync + active area</text><text x="608" y="117.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">HSYNC, VSYNC,</text><text x="608" y="133.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">data enable</text><path d="M567 112 L591 112" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="404" y="214" width="160" height="76" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="418" y="241.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Color-bar generator</text><text x="418" y="257.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Test image for</text><text x="418" y="273.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">bring-up</text><path d="M484 153 L484 211" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><text x="494" y="186" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">pixel x, y</text><rect x="594" y="214" width="150" height="76" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="608" y="241.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Output registers</text><text x="608" y="257.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Aligned with sync</text><text x="608" y="273.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">and enable</text><path d="M567 252 L591 252" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M669 153 L669 211" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><text x="44" y="330" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">Planned timing: standard 640 x 480 at 60 Hz (800 x 525 total).</text><text x="44" y="352" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">Values are standard VGA timing, not yet measured on hardware.</text><text x="44" y="396" font-size="12.5" font-weight="700" fill="#c47f00" text-anchor="start">Status: design only. Simulation and board tests are still to come.</text><text x="790" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">DE10-Nano board</text><rect x="790" y="74" width="226" height="216" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="804" y="172.26" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">ADV7513</text><text x="804" y="188.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Onboard HDMI</text><text x="804" y="203.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">transmitter</text><path d="M747 236 L787 236" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><text x="900" y="232" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">HDMI_TX_D[23:0]</text><text x="900" y="252" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">HDMI_TX_CLK, _DE, _HS, _VS</text><rect x="790" y="330" width="226" height="94" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="804" y="366.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">I2C configuration</text><text x="804" y="382.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">SCL / SDA, set by</text><text x="804" y="398.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">the FPGA at startup</text><path d="M902 327 L902 293" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_teal)"/><text x="912" y="314" font-size="11.5" font-weight="400" fill="#3d6fa5" text-anchor="start" font-style="italic">configure</text></svg>