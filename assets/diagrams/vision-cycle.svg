<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">One report cycle</title><desc id="d">A report task fetches the latest summary email, skips it if already processed, parses it, compares it with the last snapshot, formats and sends each section with checkpoints, then saves the snapshot.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="280" y="16" width="224" height="50" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="392" y="46.12" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Skip, wait for next cycle</text><rect x="24" y="100" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="126.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="143.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Fetch</text><text x="38" y="160.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Latest automated summary</text><text x="38" y="176.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">email, found by subject</text><polygon points="392.0,96.0 504.0,148 392.0,200.0 280.0,148" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="392" y="153" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Seen before?</text><rect x="536" y="100" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="550" y="126.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="550" y="143.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Parse</text><text x="550" y="160.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Attachment or body into one</text><text x="550" y="176.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">normalized JSON</text><rect x="792" y="100" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="806" y="126.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="806" y="143.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Compare</text><text x="806" y="160.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Against the last saved</text><text x="806" y="176.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">snapshot: what changed?</text><path d="M252 148 L279 148" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M505 148 L532 148" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="512" y="140" font-size="12" font-weight="700" fill="#3d6fa5" text-anchor="start">no</text><path d="M392 95 L392 69" fill="none" stroke="#c47f00" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_rust)"/><text x="402" y="84" font-size="12" font-weight="700" fill="#c47f00" text-anchor="start">yes</text><path d="M764 148 L788 148" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M904 200 L904 237 L136 237 L136 274" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="278" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="304.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="38" y="321.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Format</text><text x="38" y="338.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">One readable message</text><text x="38" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">per section</text><rect x="280" y="278" width="224" height="96" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="294" y="304.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="294" y="321.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Send in order</text><text x="294" y="338.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Checkpoint after each section;</text><text x="294" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">skip empty ones</text><rect x="536" y="278" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="550" y="304.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06</text><text x="550" y="321.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Save and mark done</text><text x="550" y="338.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">New snapshot for the next</text><text x="550" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">comparison; email processed</text><rect x="792" y="278" width="224" height="96" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="806" y="315.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Shared send queue</text><text x="806" y="331.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Every message goes through</text><text x="806" y="347.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">one queue (Fig. 4)</text><path d="M252 326 L276 326" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M508 326 L532 326" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M764 326 L788 326" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_mute)"/><rect x="24" y="414" width="488" height="66" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="444.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">A parse failure sends nothing</text><text x="38" y="460.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The task is logged and skipped. The loop carries on.</text><rect x="528" y="414" width="488" height="66" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="542" y="444.44" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">A crash resumes, not restarts</text><text x="542" y="460.62" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Checkpoints let a retry pick up at the missing section.</text></svg>