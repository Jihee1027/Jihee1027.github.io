<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Process flow in three parts</title><desc id="d">Fabrication repeats deposition or oxidation, lithography, etch, implantation, anneal, cleaning and planarization, layer by layer. The chip is built bottom to top: front end of line makes the transistors, middle end of line adds contacts to the first metal layer, and back end of line adds the metal and dielectric wiring layers.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Repeated for every layer</text><rect x="24" y="40" width="128" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="88" y="65.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Deposit</text><text x="88" y="82.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">or oxidize</text><path d="M154 68 L166 68" fill="none" stroke="#4d4d4d" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><rect x="168" y="40" width="128" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="232" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Lithography</text><path d="M298 68 L310 68" fill="none" stroke="#4d4d4d" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><rect x="312" y="40" width="128" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="376" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Etch</text><path d="M442 68 L454 68" fill="none" stroke="#4d4d4d" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><rect x="456" y="40" width="128" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="520" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Implant</text><path d="M586 68 L598 68" fill="none" stroke="#4d4d4d" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><rect x="600" y="40" width="128" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="664" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Anneal</text><path d="M730 68 L742 68" fill="none" stroke="#4d4d4d" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><rect x="744" y="40" width="128" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="808" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Clean</text><path d="M874 68 L886 68" fill="none" stroke="#4d4d4d" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><rect x="888" y="40" width="128" height="56" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="952" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Planarize</text><text x="24" y="138" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What those steps build, bottom to top</text><rect x="24" y="156" width="900" height="78" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="193.43" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start">BEOL  ·  Back end of line</text><text x="38" y="212.92" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Metal wiring and insulating layers connect everything on the chip</text><rect x="24" y="244" width="900" height="78" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="281.43" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start">MEOL  ·  Middle end of line</text><text x="38" y="300.92" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Contacts link the transistors to the first metal layer</text><rect x="24" y="332" width="900" height="78" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="38" y="369.43" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start">FEOL  ·  Front end of line</text><text x="38" y="388.92" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Isolation, gate, source and drain: the transistors themselves</text><rect x="24" y="416" width="900" height="16" rx="4" fill="#e6e6e6" stroke="#333333" stroke-width="1.2"/><text x="36" y="428" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Silicon wafer</text><path d="M980 424 L980 160" fill="none" stroke="#3d6fa5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><text x="1000" y="300" font-size="13" font-weight="700" fill="#3d6fa5" text-anchor="middle">built</text><text x="1000" y="318" font-size="13" font-weight="700" fill="#3d6fa5" text-anchor="middle">first</text><text x="24" y="458" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">The exact sequence depends on the device architecture and integration scheme.</text></svg>