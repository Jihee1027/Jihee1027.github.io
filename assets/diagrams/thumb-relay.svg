<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Reporting automation overview</title><desc id="d">Report emails go through one queue to the right chat room without duplicates; image delivery is an extension in development.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="20" y="36" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Relay service</text><rect x="20" y="50" width="128" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="34" y="89.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Inputs</text><text x="34" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Report emails</text><text x="34" y="122.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">(images: in dev.)</text><path d="M151 100 L173 100" fill="none" stroke="#333333" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="176" y="50" width="128" height="100" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="190" y="89.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">One queue</text><text x="190" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">One sender</text><text x="190" y="122.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">at a time</text><path d="M307 100 L329 100" fill="none" stroke="#333333" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="332" y="50" width="128" height="100" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="346" y="89.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Chat</text><text x="346" y="106.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Right room,</text><text x="346" y="122.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">no repeats</text><text x="20" y="186" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What keeps it running</text><rect x="20" y="200" width="136" height="48" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="88" y="229.12" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">No repeats</text><rect x="168" y="200" width="136" height="48" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="236" y="229.12" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Checkpoints</text><rect x="316" y="200" width="136" height="48" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="384" y="229.12" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Auto restart</text></svg>