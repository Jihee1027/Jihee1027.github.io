<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">One processing element and the array</title><desc id="d">Inside one processing element: the activation passes through an x_pipe register to the next element on the right, the stationary weight register and the activation feed an FP8 multiplier, an FP8 adder combines the product with the partial sum from above, and a partial-sum register passes the result down. Activations move right, partial sums move down, and weights stay in place.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">One processing element (PE)</text><rect stroke-dasharray="6 5" x="24" y="44" width="736" height="330" rx="9" fill="none" stroke="#8d978f" stroke-width="1.2"/><rect x="60" y="76" width="150" height="64" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="74" y="105.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Weight register</text><text x="74" y="121.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Stationary, loaded once</text><rect x="60" y="240" width="150" height="64" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="74" y="269.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">x_pipe register</text><text x="74" y="285.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Activation delay</text><rect x="270" y="156" width="130" height="64" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="284" y="185.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">FP8 multiply</text><text x="284" y="201.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">weight x activation</text><rect x="440" y="156" width="116" height="64" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="454" y="185.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">FP8 add</text><text x="454" y="201.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Add partial sum</text><rect x="600" y="156" width="140" height="64" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="614" y="185.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Partial-sum reg.</text><text x="614" y="201.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">To the PE below</text><path d="M135 142 L135 178 L267 178" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M8 272 L57 272" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><text x="30" y="330" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Activation in</text><path d="M30 272 L30 204 L267 204" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M403 188 L437 188" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M559 188 L597 188" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M498 100 L498 153" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><text x="508" y="112" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Partial sum in (from above)</text><path d="M670 223 L670 262" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="662" y="252" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="end">Partial sum out</text><path d="M213 272 L758 272" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><text x="230" y="296" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Activation out to the next PE on the right</text><text x="790" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">How PEs connect (2 x 2 of 8 x 8)</text><rect x="790" y="60" width="100" height="64" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="804" y="89.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">PE</text><text x="804" y="105.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">row 0, col 0</text><rect x="906" y="60" width="100" height="64" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="920" y="89.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">PE</text><text x="920" y="105.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">row 0, col 1</text><rect x="790" y="170" width="100" height="64" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="804" y="199.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">PE</text><text x="804" y="215.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">row 1, col 0</text><rect x="906" y="170" width="100" height="64" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="920" y="199.78" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start">PE</text><text x="920" y="215.05" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">row 1, col 1</text><path d="M892 92 L904 92" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M892 202 L904 202" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M840 126 L840 168" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M956 126 L956 168" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><text x="790" y="258" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Activations move right.</text><text x="790" y="282" font-size="11.5" font-weight="700" fill="#3d6fa5" text-anchor="start">Partial sums move down.</text><text x="790" y="306" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Weights stay in each PE.</text><text x="790" y="330" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Results leave the bottom row.</text></svg>