<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 486" width="1040" height="486" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Qualifying a process change with downstream evidence</title><desc id="d">Eight steps for the anode dual side tab pressing change: downstream feedback, a proposed concept, equipment and vendor setup, a controlled 4M qualification across production lots, sample collection and hand off to Quality, review with Assembly, improved downstream behavior and a decision on broader implementation.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="36" width="224" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="69.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01 · Assembly</text><text x="38" y="86.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Downstream feedback</text><text x="38" y="103.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Elevated tab-related defects</text><text x="38" y="119.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">reported to the line</text><rect x="280" y="36" width="224" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="294" y="69.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02 · Process</text><text x="294" y="86.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Concept proposed</text><text x="294" y="103.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Dual side tab pressing</text><text x="294" y="119.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">on the anode line</text><rect x="536" y="36" width="224" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="550" y="69.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03 · Equipment + vendor</text><text x="550" y="86.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Setup prepared</text><text x="550" y="103.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Equipment and vendor teams</text><text x="550" y="119.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">prepare the required setup</text><rect x="792" y="36" width="224" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="806" y="69.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04 · Process</text><text x="806" y="86.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Change qualification (4M)</text><text x="806" y="103.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Multiple production lots,</text><text x="806" y="119.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">defined sampling plan</text><path d="M253 91 L275 91" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M509 91 L531 91" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M765 91 L787 91" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M904 151 L904 196 L136 196 L136 241" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="246" width="224" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="279.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05 · Process</text><text x="38" y="296.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Samples collected</text><text x="38" y="313.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Representative samples and</text><text x="38" y="329.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">supporting data to Quality</text><rect x="280" y="246" width="224" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="294" y="279.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06 · Quality + Assembly</text><text x="294" y="296.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Review</text><text x="294" y="313.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Did the original tab-defect</text><text x="294" y="329.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">behavior improve downstream?</text><rect x="536" y="246" width="224" height="110" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="550" y="279.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">07 · Downstream</text><text x="550" y="296.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Behavior improved</text><text x="550" y="313.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The original tab-defect trend</text><text x="550" y="329.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">improved during review</text><rect x="792" y="246" width="224" height="110" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="806" y="279.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">08 · Decision</text><text x="806" y="296.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Broader implementation</text><text x="806" y="313.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Planned after the Quality</text><text x="806" y="329.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">and downstream review</text><path d="M253 301 L275 301" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M509 301 L531 301" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M765 301 L787 301" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="24" y="396" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">A local improvement was not enough. The change was judged on what happened downstream.</text><text x="24" y="418" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">Sample counts, line identifiers, acceptance thresholds and rollout details are left out.</text><rect x="24" y="456" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="468" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="456" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="138.672" y="468" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Key point</text><rect x="218.6875" y="456" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="248.688" y="468" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>