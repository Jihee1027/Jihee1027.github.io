<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 326" width="1040" height="326" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">From a software symptom to a hardware cause</title><desc id="d">A failure that returns or cannot be explained in software moves down to signal-level evidence: equipment logs, an oscilloscope or logic analyzer on trigger timing, camera behavior, communication and cabling. The evidence narrows the cause to an interface or hardware element, which is then fixed and verified.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Generic debugging flow</text><rect x="24" y="50" width="224" height="110" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="84.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="100.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Software symptom</text><text x="38" y="116.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Missed or repeated inspections,</text><text x="38" y="132.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">gaps in image logging</text><rect x="280" y="50" width="224" height="110" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="294" y="84.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="294" y="100.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Signal evidence</text><text x="294" y="116.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Equipment logs, oscilloscope and</text><text x="294" y="132.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">logic analyzer on the signals</text><rect x="536" y="50" width="224" height="110" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="550" y="84.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="550" y="100.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Interface or hardware cause</text><text x="550" y="116.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Trigger timing, camera behavior,</text><text x="550" y="132.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">communication or cabling</text><rect x="792" y="50" width="224" height="110" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="806" y="84.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="806" y="100.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Controlled fix, then verify</text><text x="806" y="116.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Re-check the signals and the</text><text x="806" y="132.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">live inspection images</text><path d="M252 105 L276 105" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M508 105 L532 105" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M764 105 L788 105" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect stroke-dasharray="5 4" x="24" y="196" width="992" height="64" rx="7" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="44" y="224" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The pattern: start from the symptom the software shows, then find the signal that explains it.</text><text x="44" y="244" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Orange marks a suspected cause until a signal check confirms it.</text><rect x="24" y="296" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="308" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="296" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="138.672" y="308" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Key point</text><rect x="218.6875" y="296" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="248.688" y="308" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="372.71875" y="296" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="402.719" y="308" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>