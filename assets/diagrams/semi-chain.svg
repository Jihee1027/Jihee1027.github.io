<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 280" width="1040" height="280" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">From process to system, conceptual</title><desc id="d">Four levels. Process: CD, material stack, interfaces, doping, resistance. Device: Vth, drive current, leakage, capacitance. Circuit: cell delay, switching, power, timing margin. Chip or system: frequency, power, functional margin. A conceptual relationship, not a deterministic fault tree.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="24" width="224" height="170" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="73.07" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="96" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">Process</text><text x="38" y="115.67" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">CD, material stack</text><text x="38" y="134.17" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Interfaces, doping</text><text x="38" y="152.67" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Resistance</text><rect x="280" y="24" width="224" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="294" y="73.07" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="294" y="96" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">Device</text><text x="294" y="115.67" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Vth, drive current</text><text x="294" y="134.17" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Leakage</text><text x="294" y="152.67" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Capacitance</text><rect x="536" y="24" width="224" height="170" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="550" y="73.07" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="550" y="96" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">Circuit</text><text x="550" y="115.67" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Cell delay</text><text x="550" y="134.17" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Switching, power</text><text x="550" y="152.67" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Timing margin</text><rect x="792" y="24" width="224" height="170" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="806" y="73.07" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="806" y="96" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">Chip / system</text><text x="806" y="115.67" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Frequency</text><text x="806" y="134.17" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Power</text><text x="806" y="152.67" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Functional margin</text><path d="M251 109 L277 109" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M507 109 L533 109" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M763 109 L789 109" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="24" y="238" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">Conceptual, not a deterministic fault tree.</text></svg>