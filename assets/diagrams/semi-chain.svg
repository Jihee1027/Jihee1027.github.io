<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">From process to system, conceptual</title><desc id="d">Four stacked levels, top to bottom. Process: critical dimension, material stack, interfaces, doping and resistance. Device: threshold voltage, drive current, leakage and capacitance. Circuit: cell delay, switching behavior, power and timing margin. Chip or system: frequency, power and functional margin. A conceptual relationship, not a deterministic fault tree.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="16" width="992" height="66" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="43.34" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">PROCESS</text><text x="38" y="61.08" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">CD  ·  material stack  ·  interfaces  ·  doping  ·  resistance</text><path d="M520 85 L520 109" fill="none" 