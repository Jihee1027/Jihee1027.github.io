<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 324" width="1040" height="324" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Approach to a Vth shift</title><desc id="d">Four steps: find the pattern, correlate with metrology, electrical data and process history, contain and compare with healthy references, then test a hypothesis with monitor material, splits or a DOE. Possible contributors, suspected until the evidence supports them: gate dielectric thickness or EOT, interface quality, work-function metal, channel doping, CD and geometry, thermal history.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="24" width="224" height="128" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="38" y="61.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="83.93" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start">Find the pattern</text><text x="38" y="103.42" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Lot, wafer, tool,</text><text x="38" y="121.92" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">chamber, start time</text><rect x="280" y="24" width="224" height="128" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="294" y="61.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="294" y="83.93" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start">Correlate</text><text x="294" y="103.42" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Metrology, electrical</text><text x="294" y="121.92" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">data, process history</text><rect x="536" y="24" width="224" height="128" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="550" y="61.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="550" y="83.93" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start">Contain, compare</text><text x="550" y="103.42" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Healthy reference,</text><text x="550" y="121.92" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">tool or time commonality</text><rect x="792" y="24" width="224" height="128" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="806" y="61.82" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="806" y="83.93" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start">Test a hypothesis</text><text x="806" y="103.42" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">Monitor wafers,</text><text x="806" y="121.92" font-size="15" font-weight="400" fill="#4d4d4d" text-anchor="start">splits, DOE</text><path d="M251 88 L277 88" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M507 88 L533 88" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M763 88 L789 88" fill="none" stroke="#333333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M520 160 L520 190" fill="none" stroke="#c47f00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_rust)"/><text x="24" y="208" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Possible contributors, suspected until the evidence supports them</text><rect x="24" y="226" width="158" height="70" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="103" y="258.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Gate dielectric</text><text x="103" y="275.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">thickness, EOT</text><rect x="190" y="226" width="158" height="70" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="269" y="258.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Interface</text><text x="269" y="275.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">quality</text><rect x="356" y="226" width="158" height="70" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="435" y="258.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Work-function</text><text x="435" y="275.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">metal stack</text><rect x="522" y="226" width="158" height="70" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="601" y="258.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Channel</text><text x="601" y="275.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">doping</text><rect x="688" y="226" width="158" height="70" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="767" y="258.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">CD</text><text x="767" y="275.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">geometry</text><rect x="854" y="226" width="158" height="70" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="933" y="258.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Thermal</text><text x="933" y="275.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">history</text></svg>