<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 506" width="1040" height="506" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Following the equipment evidence on uncutting</title><desc id="d">Uncutting appeared in the acceleration zone at higher line speed. A quick physical check made suction less likely as the primary cause. Power and frequency adjustments, then a focus adjustment, produced no response. The laser PC log showed the expected power response was not occurring in the acceleration zone. The lack of response to process settings moved the investigation toward optical and focusing hardware, and a laser specialist repaired the focusing equipment the following day.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="20" width="992" height="64" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="38" y="49.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Uncutting during the speed change</text><text x="38" y="66.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The production team asked for help. The cut was incomplete in the acceleration zone when we tried to run faster.</text><rect x="24" y="116" width="320" height="120" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="155.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01  PHYSICAL CHECK</text><text x="38" y="171.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Suction less likely</text><text x="38" y="187.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">A quick physical check did not support</text><text x="38" y="203.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">suction as the primary cause.</text><rect x="360" y="116" width="320" height="120" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="374" y="155.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02  PROCESS SETTINGS</text><text x="374" y="171.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Recipe changes: no response</text><text x="374" y="187.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Power and frequency adjustments</text><text x="374" y="203.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">did not move the defect.</text><rect x="696" y="116" width="320" height="120" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="710" y="155.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03  PROCESS SETTINGS</text><text x="710" y="171.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Focus adjustment: no response</text><text x="710" y="187.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Adjusting the focus produced</text><text x="710" y="203.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">no response either.</text><rect x="24" y="262" width="320" height="120" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="38" y="301.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04  EQUIPMENT EVIDENCE</text><text x="38" y="317.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Laser PC log</text><text x="38" y="333.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The expected power response was not</text><text x="38" y="349.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">occurring in the acceleration zone.</text><rect x="360" y="262" width="320" height="120" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="374" y="293.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05  WORKING CONCLUSION</text><text x="374" y="309.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Shift to focusing hardware</text><text x="374" y="325.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">No response to process settings moved</text><text x="374" y="341.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">the investigation from the recipe to</text><text x="374" y="357.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">the laser hardware.</text><rect x="696" y="262" width="320" height="120" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="710" y="301.09" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06  VENDOR REPAIR</text><text x="710" y="317.6" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Diagnosis and repair</text><text x="710" y="333.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">A laser specialist repaired the focusing</text><text x="710" y="349.87" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">equipment the following day.</text><path d="M346 176 L358 176" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M346 322 L358 322" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M682 176 L694 176" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M682 322 L694 322" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M856 238 L856 250 L184 250 L184 260" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><rect stroke-dasharray="5 4" x="24" y="404" width="992" height="48" rx="7" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="44" y="434" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Process settings were exhausted first, then the equipment evidence redirected the search. The repair came the next day.</text><rect x="24" y="476" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="488" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="476" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="138.672" y="488" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Key point</text><rect x="218.6875" y="476" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="248.688" y="488" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="372.71875" y="476" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="402.719" y="488" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>