<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 506" width="1040" height="506" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Narrowing uncutting down, one suspect at a time</title><desc id="d">Uncutting appeared in the acceleration zone at higher line speed. A hand-tear test pointed away from suction and toward the laser. Raising power, changing frequency and adjusting focus changed nothing. The laser PC log showed the power not rising as commanded in that zone, which pointed to the beam-focusing lens. A vendor laser specialist repaired the focusing equipment and the lens the next day.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="20" width="992" height="64" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="38" y="49.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Uncutting during the speed change</text><text x="38" y="66.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The production team asked for help. The cut was incomplete in the acceleration zone when we tried to run faster.</text><rect x="24" y="116" width="320" height="120" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="146.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01  RULED OUT</text><text x="38" y="163.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Suction</text><text x="38" y="180.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Pulled the cut material off by hand.</text><text x="38" y="196.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">It would not come away cleanly, so I</text><text x="38" y="212.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">turned to the laser.</text><rect x="360" y="116" width="320" height="120" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="374" y="146.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02  RULED OUT</text><text x="374" y="163.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Laser settings</text><text x="374" y="180.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Raised the power and the acceleration</text><text x="374" y="196.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">power, then changed the frequency.</text><text x="374" y="212.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">No change.</text><rect x="696" y="116" width="320" height="120" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="710" y="154.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03  RULED OUT</text><text x="710" y="171.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Focus</text><text x="710" y="188.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Adjusted the focus.</text><text x="710" y="204.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Still no change.</text><rect x="24" y="262" width="320" height="120" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="38" y="300.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04  EVIDENCE</text><text x="38" y="317.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Laser PC log</text><text x="38" y="334.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">In that zone the power was not rising</text><text x="38" y="350.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">as commanded. It was dropping.</text><rect x="360" y="262" width="320" height="120" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="374" y="300.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05  CAUSE</text><text x="374" y="317.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">The beam-focusing lens</text><text x="374" y="334.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The lens that focuses the beam</text><text x="374" y="350.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">had failed.</text><rect x="696" y="262" width="320" height="120" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="710" y="300.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06  FIX</text><text x="710" y="317.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Next day, the vendor</text><text x="710" y="334.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">A laser specialist repaired the focusing</text><text x="710" y="350.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">equipment and the lens.</text><path d="M346 176 L358 176" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M346 322 L358 322" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M682 176 L694 176" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M682 322 L694 322" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M856 238 L856 250 L184 250 L184 260" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><rect stroke-dasharray="5 4" x="24" y="404" width="992" height="48" rx="7" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="44" y="434" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">From the morning until about 7 pm. Process Technology engineers and vendor staff joined, and it still was not fixed that day.</text><rect x="24" y="476" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="488" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="476" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="138.672" y="488" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Key point</text><rect x="218.6875" y="476" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="248.688" y="488" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="372.71875" y="476" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="402.719" y="488" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>