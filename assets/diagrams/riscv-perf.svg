<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Execution time of mergesort: single-cycle versus pipeline</title><desc id="d">Execution time in microseconds at memory latencies 0, 2, 6 and 10. Single-cycle: 145.2, 275.4, 550.7 and 826.1. Pipeline: 120.8, 233.5, 436.1 and 638.8. The pipeline is 1.20, 1.18, 1.26 and 1.29 times faster. Cycle counts are from simulation and clock frequency is from synthesis.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Execution time of mergesort (microseconds, lower is better)</text><rect x="24" y="40" width="16" height="16" rx="3" fill="#d6d6d6" stroke="#333333" stroke-width="1.2"/><text x="48" y="53" font-size="13.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Single-cycle</text><rect x="170" y="40" width="16" height="16" rx="3" fill="#b7cdf0" stroke="#3d6fa5" stroke-width="1.2"/><text x="194" y="53" font-size="13.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Pipeline</text><rect x="24" y="300" width="992" height="1.5" rx="0" fill="#333333" stroke="none" stroke-width="0"/><rect x="59" y="261.332" width="84" height="38.6684" rx="4" fill="#d6d6d6" stroke="#333333" stroke-width="1.2"/><rect x="153" y="267.83" width="84" height="32.1704" rx="4" fill="#b7cdf0" stroke="#3d6fa5" stroke-width="1.2"/><text x="101" y="253.332" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">145.2</text><text x="195" y="259.83" font-size="13.5" font-weight="700" fill="#3d6fa5" text-anchor="middle">120.8</text><text x="148" y="326" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">Memory latency 0</text><text x="148" y="350" font-size="15" font-weight="700" fill="#3d6fa5" text-anchor="middle">1.20x faster</text><rect x="307" y="226.658" width="84" height="73.3422" rx="4" fill="#d6d6d6" stroke="#333333" stroke-width="1.2"/><rect x="401" y="237.816" width="84" height="62.1838" rx="4" fill="#b7cdf0" stroke="#3d6fa5" stroke-width="1.2"/><text x="349" y="218.658" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">275.4</text><text x="443" y="229.816" font-size="13.5" font-weight="700" fill="#3d6fa5" text-anchor="middle">233.5</text><text x="396" y="326" font-size="13.5" font-weight="400" fill="#4d4d4d" text-anchor="middle">Memory latency 2</text><text x="396" y="350" font-size="15" font-weight="700" fill="#3d6fa5" text-anchor="middle">1.18x faster</text><rect x="555" y="153.342" width="84" height="146.658" rx="4" fill="#d6d6d6" stroke="#333333" stroke-width="1.2"/><rect x="649" y="183.862" width="84" height="116.138" rx="4" fill="#b7cdf0" stroke="#3d6fa5" stroke-width="1.2"/><text x="597" y="145.342" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">550.7</text><text x="691" y="175.862" font-size="13.5" font-weight="700" fill="#3d6fa5" text-anchor="middle">436.1</text><text x="644" 