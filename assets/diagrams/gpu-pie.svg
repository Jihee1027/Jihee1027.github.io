<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" width="1040" height="372" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">What this project shows for process integration</title><desc id="d">Three rows. DSP slices were measured per block before any change: data before changes. One block was changed at a time with timing rechecked after each merge: qualify each change. The board test is blocked, so simulation results are kept separate from board results: verified versus untested.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What happened</text><text x="370" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">The habit</text><text x="716" y="26" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Where process integration uses it</text><rect x="24" y="44" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">DSP use: measured first</text><text x="38" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Per block, then cut</text><text x="38" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">from 40 to 13 slices</text><rect x="370" y="44" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Data before changes</text><text x="384" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Know where the</text><text x="384" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">resource goes</text><rect x="716" y="44" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="79.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Data-driven changes</text><text x="730" y="96.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Act on measurements,</text><text x="730" y="113.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">not on guesses</text><path d="M328 90 L366 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 90 L712 90" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="152" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">One block at a time</text><text x="38" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Re-ran all 761 checks and</text><text x="38" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">timing after each merge</text><rect x="370" y="152" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Recheck the margin</text><text x="384" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Slack stayed positive:</text><text x="384" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">+0.388 ns at 125 MHz</text><rect x="716" y="152" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="187.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Qualify each change</text><text x="730" y="204.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">A change is done when</text><text x="730" y="221.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">the margin is rechecked</text><path d="M328 198 L366 198" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 198 L712 198" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="260" width="300" height="92" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Board test blocked</text><text x="38" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Lab PCs do not detect</text><text x="38" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">the board</text><rect x="370" y="260" width="300" height="92" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="384" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Verified vs untested</text><text x="384" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Simulation and Vivado shown</text><text x="384" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">apart from the board</text><rect x="716" y="260" width="300" height="92" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="730" y="295.58" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Clear status</text><text x="730" y="312.53" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">Say which results are</text><text x="730" y="329.03" font-size="13" font-weight="400" fill="#4d4d4d" text-anchor="start">confirmed</text><path d="M328 306 L366 306" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M674 306 L712 306" fill="none" stroke="#333333" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/></svg>