<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">FPGA retro game console system</title><desc id="d">ESP32 controllers feed a DE10-Nano FPGA over SPI. The FPGA hosts a RISC-V soft core for game logic and a tile-based graphics engine, which drive HDMI video and audio outputs. A custom PCB provides power and board-level hardware.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="168" width="190" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="214.26" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">ESP32 controllers</text><text x="38" y="230.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Two players: joystick,</text><text x="38" y="245.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">buttons, switches</text><rect stroke-dasharray="6 5" x="300" y="48" width="440" height="308" rx="10" fill="none" stroke="#3d6fa5" stroke-width="1.5"/><text x="322" y="80" font-size="12" font-weight="700" fill="#3d6fa5" text-anchor="start">DE10-Nano FPGA</text><rect x="324" y="100" width="392" height="100" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="338" y="136.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Software on the FPGA</text><text x="338" y="153.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">RISC-V soft core</text><text x="338" y="170.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Game logic, written in C</text><rect x="324" y="232" width="392" height="100" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="338" y="268.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Hardware on the FPGA</text><text x="338" y="285.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Tile-based graphics</text><text x="338" y="302.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Tile map plus pattern table, not a frame buffer</text><path d="M520 203 L520 229" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M218 224 L296 224" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="257" y="214" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="middle">SPI</text><rect x="826" y="96" width="190" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="840" y="141.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Video out</text><text x="840" y="158.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">HDMI to a monitor</text><rect x="826" y="212" width="190" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="840" y="257.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Audio out</text><text x="840" y="274.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Basic sound</text><path d="M744 144 L822 144" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M744 260 L822 260" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="396" width="992" height="74" rx="8" fill="#ffe6cc" stroke="#c47f00" stroke-width="1.5"/><text x="46" y="426" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Custom PCB</text><text x="46" y="448" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Power and board-level hardware around the FPGA, planned as part of the hardware architecture.</text></svg>