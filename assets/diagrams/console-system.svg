<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">FPGA retro game console system</title><desc id="d">Two control stations feed an ESP32 controller interface, which talks to a DE10-Nano FPGA over SPI. Inside the FPGA, a RISC-V soft core implemented in fabric runs the game software written in C, and a tile-based graphics engine in RTL draws the screen. The FPGA drives HDMI video through the board's onboard HDMI transmitter, plus audio. A custom PCB is planned for power and board-level hardware.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Hardware and software in the system</text><rect x="24" y="150" width="160" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="195.62" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">Two control stations</text><text x="38" y="211.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Joysticks, D-pad,</text><text x="38" y="226.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">buttons</text><rect x="214" y="150" width="150" height="112" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="228" y="195.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">ESP32</text><text x="228" y="211.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Controller</text><text x="228" y="227.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">interface</text><path d="M187 206 L211 206" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect stroke-dasharray="6 5" x="420" y="44" width="380" height="330" rx="10" fill="none" stroke="#3d6fa5" stroke-width="1.5"/><text x="440" y="72" font-size="12" font-weight="700" fill="#3d6fa5" text-anchor="start">DE10-Nano FPGA</text><rect x="440" y="88" width="340" height="74" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="454" y="112.59" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Software</text><text x="454" y="128.69" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Game software</text><text x="454" y="144.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">C program running on the RISC-V core</text><rect x="440" y="186" width="340" height="76" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="454" y="211.59" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Hardware (RTL)</text><text x="454" y="227.69" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">RISC-V soft core</text><text x="454" y="243.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Hardware CPU implemented in FPGA fabric</text><rect x="440" y="288" width="340" height="70" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="454" y="310.59" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">Hardware (RTL)</text><text x="454" y="326.69" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Tile-based graphics engine</text><text x="454" y="342.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Tile map plus pattern table, not a frame buffer</text><path d="M610 164 L610 183" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><text x="618" y="178" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start" font-style="italic">runs on</text><path d="M580 265 L580 285" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><path d="M640 285 L640 265" fill="none" stroke="#3d6fa5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_teal)"/><text x="656" y="280" font-size="11" font-weight="400" fill="#3d6fa5" text-anchor="start" font-style="italic">game state</text><path d="M367 206 L417 206" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="392" y="196" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="middle">SPI</text><rect x="836" y="96" width="180" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="850" y="133.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">HDMI video out</text><text x="850" y="149.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Onboard HDMI</text><text x="850" y="165.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">transmitter</text><rect x="836" y="226" width="180" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="850" y="271.69" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Audio out</text><text x="850" y="287.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Basic sound</text><path d="M804 144 L832 144" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M804 274 L832 274" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a_mute)"/><rect x="24" y="410" width="992" height="80" rx="8" fill="#ffe6cc" stroke="#c47f00" stroke-width="1.5"/><text x="46" y="440" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Custom PCB (planned)</text><text x="46" y="464" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Power and board-level hardware around the FPGA, to be defined from the interface signals found during prototype testing.</text></svg>