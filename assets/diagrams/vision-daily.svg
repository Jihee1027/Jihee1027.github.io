<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 576" width="1040" height="576" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">A day of vision data checks</title><desc id="d">Morning: review overnight vision data, system health and over- and missed detection, then plan. Afternoon: investigate flagged views, adjust, verify with the same data, and record. All day: hourly alerts, and the troubleshooting ladder when a system goes down.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="24" width="488" height="392" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="44" y="52" font-size="11" font-weight="700" fill="#3d6fa5" text-anchor="start" letter-spacing="1.4">MORNING</text><text x="44" y="74" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">What happened since yesterday</text><rect x="44" y="92" width="448" height="72" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="58" y="108.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="58" y="123.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Overnight vision data</text><text x="58" y="139.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Defect rate by view, in</text><text x="58" y="154.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">SPC and Spotfire</text><path d="M268 165 L268 171" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="44" y="172" width="448" height="72" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="58" y="188.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="58" y="203.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">System health</text><text x="58" y="219.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Missed or false triggers,</text><text x="58" y="234.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">image-logging gaps, down events</text><path d="M268 245 L268 251" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="44" y="252" width="448" height="72" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="58" y="268.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="58" y="283.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">False positives and negatives</text><text x="58" y="299.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Which view drifted? Check</text><text x="58" y="314.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">against stored images</text><path d="M268 325 L268 331" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="44" y="332" width="448" height="72" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="58" y="348.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="58" y="363.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Plan the day</text><text x="58" y="379.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">What needs a recipe change</text><text x="58" y="394.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">or a bench check</text><rect x="528" y="24" width="488" height="392" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/><text x="548" y="52" font-size="11" font-weight="700" fill="#3d6fa5" text-anchor="start" letter-spacing="1.4">AFTERNOON</text><text x="548" y="74" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start">Act on it and prove it</text><rect x="548" y="92" width="448" height="72" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="562" y="108.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="562" y="123.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Investigate</text><text x="562" y="139.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Images and equipment logs</text><text x="562" y="154.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">for the flagged views</text><path d="M772 165 L772 171" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="548" y="172" width="448" height="72" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="562" y="188.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06</text><text x="562" y="203.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Fix or adjust</text><text x="562" y="219.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Recipe, camera, trigger</text><text x="562" y="234.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">timing or hardware</text><path d="M772 245 L772 251" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="548" y="252" width="448" height="72" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="562" y="268.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">07</text><text x="562" y="283.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Verify</text><text x="562" y="299.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Same data again, after the</text><text x="562" y="314.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">change, in production</text><path d="M772 325 L772 331" fill="none" stroke="#333333" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="548" y="332" width="448" height="72" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="562" y="348.02" font-size="10.0" font-weight="400" fill="#4d4d4d" text-anchor="start">08</text><text x="562" y="363.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">Record</text><text x="562" y="379.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">What changed, why, and</text><text x="562" y="394.3" font-size="11.5" font-weight="400" fill="#4d4d4d" text-anchor="start">what to keep watching</text><path d="M514 220 L526 220" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="24" y="436" width="488" height="84" rx="7" fill="#ffffff" stroke="#999999" stroke-width="1.1" stroke-dasharray="5 4"/><text x="38" y="467.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">All day: hourly alerts</text><text x="38" y="483.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">A Python report tool watches FMCS data and</text><text x="38" y="499.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">sends an alert every hour</text><rect x="528" y="436" width="488" height="84" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="542" y="467.94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">If a system goes down</text><text x="542" y="483.71" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Use the troubleshooting ladder</text><text x="542" y="499.21" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">(next figure) instead of guessing</text><rect x="24" y="546" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="54" y="558" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Step</text><rect x="108.671875" y="546" width="22" height="14" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="138.672" y="558" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Key point</text><rect x="218.6875" y="546" width="22" height="14" rx="3" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/><text x="248.688" y="558" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Problem or cause</text><rect x="372.71875" y="546" width="22" height="14" rx="3" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="402.719" y="558" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Fix or result</text></svg>