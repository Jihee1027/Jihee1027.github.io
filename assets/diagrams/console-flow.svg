<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" width="1040" height="270" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Command-line FPGA development flow</title><desc id="d">RTL and a testbench are simulated in Questa with a waveform check, synthesized and timing-checked in Quartus, then programmed over USB Blaster and JTAG and confirmed on the board LED. A Makefile runs each step.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="28" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">One Makefile, one module at a time</text><rect x="24" y="46" width="184" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="77.59" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="94.1" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">RTL + testbench</text><text x="38" y="109.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">SystemVerilog module</text><text x="38" y="125.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">and its own testbench</text><rect x="226" y="46" width="184" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="240" y="77.59" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="240" y="94.1" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Simulate</text><text x="240" y="109.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Questa script, signal</text><text x="240" y="125.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">visibility on</text><rect x="428" y="46" width="184" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="442" y="77.59" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="442" y="94.1" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Check waveform</text><text x="442" y="109.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Clock, counter and</text><text x="442" y="125.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">outputs as expected?</text><rect x="630" y="46" width="184" height="104" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="644" y="77.59" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="644" y="94.1" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Synthesize</text><text x="644" y="109.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">Quartus compile,</text><text x="644" y="125.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">timing reports</text><rect x="832" y="46" width="184" height="104" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="846" y="77.59" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="846" y="94.1" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Program and test</text><text x="846" y="109.96" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">SOF over USB Blaster,</text><text x="846" y="125.46" font-size="12" font-weight="400" fill="#4d4d4d" text-anchor="start">check the board</text><path d="M210 98 L224 98" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M412 98 L426 98" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M614 98 L628 98" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M816 98 L830 98" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect stroke-dasharray="5 4" x="24" y="184" width="992" height="60" rx="7" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="44" y="210" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Source, testbenches, scripts, FPGA project files and generated build files are kept in separate folders,</text><text x="44" y="230" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">so the compile output never mixes with the design.</text></svg>