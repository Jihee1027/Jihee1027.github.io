<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">How I work through a process problem</title><desc id="d">Nine linked steps: process step interactions, process variation, equipment behavior, in process inspection and production data, downstream response, root cause localization, DOE or controlled change, qualification, and a stable Process of Record.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><rect x="24" y="28" width="296" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01</text><text x="38" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Process step interactions</text><text x="38" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">How one step affects the next</text><path d="M325 70 L367 70" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="372" y="28" width="296" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="386" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02</text><text x="386" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Process variation</text><text x="386" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Where it begins, how it propagates</text><path d="M673 70 L715 70" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="720" y="28" width="296" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="734" y="56.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03</text><text x="734" y="73.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Equipment behavior</text><text x="734" y="90.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Alarms, logs, downtime</text><rect x="24" y="160" width="296" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="188.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">04</text><text x="38" y="205.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Inspection and production data</text><text x="38" y="222.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">In process inspection, SPC, Spotfire</text><path d="M325 202 L367 202" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="372" y="160" width="296" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="386" y="188.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">05</text><text x="386" y="205.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Downstream response</text><text x="386" y="222.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Assembly and Quality feedback</text><path d="M673 202 L715 202" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="720" y="160" width="296" height="84" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="734" y="188.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">06</text><text x="734" y="205.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Root cause localization</text><text x="734" y="222.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Which step, tool or condition</text><rect x="24" y="292" width="296" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="320.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">07</text><text x="38" y="337.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">DOE or controlled change</text><text x="38" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">One variable at a time, with a baseline</text><path d="M325 334 L367 334" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="372" y="292" width="296" height="84" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="386" y="320.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">08</text><text x="386" y="337.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Qualification</text><text x="386" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Samples and data reviewed with Quality</text><path d="M673 334 L715 334" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><rect x="720" y="292" width="296" height="84" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/><text x="734" y="320.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">09</text><text x="734" y="337.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Stable Process of Record</text><text x="734" y="354.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Verified in production data</text><path d="M868 117 L868 136 L172 136 L172 155" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M868 249 L868 268 L172 268 L172 287" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/></svg>