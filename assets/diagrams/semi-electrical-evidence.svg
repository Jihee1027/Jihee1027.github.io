<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">Electrical signals guide the next check</title><desc id="desc">Read the measurements together before choosing a process hypothesis.</desc><rect width="1040" height="100%" fill="#fffdf9"/><style>text{font-family:Arial,sans-serif;fill:#20343b}.title{font-family:Georgia,serif;font-size:29px}.sub{font-size:17px;fill:#5e7077}.label{font-size:21px;font-weight:600}.body{font-size:18px}.tag{font-size:14px;letter-spacing:1px;fill:#0f5c63}</style><text class="title" x="36" y="49">Electrical signals guide the next check</text><text class="sub" x="36" y="79">Read the measurements together before choosing a process hypothesis.</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#0f5c63" stroke-width="1.5"/></marker></defs><rect x="36" y="105" width="968" height="90" rx="5" fill="#edf3f1" stroke="#d3dbd7"/><text class="tag" x="58" y="130">DEVICE / FEOL</text><text class="label" x="58" y="162">Vth shift</text><path d="M325 150H368" stroke="#0f5c63" stroke-width="1.5" marker-end="url(#arrow)"/><text class="body" x="394" y="141">Gate stack, channel geometry and thermal history</text><text class="sub" x="394" y="168">Compare the same device type, bias conditions and extraction method.</text><rect x="36" y="213" width="968" height="90" rx="5" fill="#f5f3ed" stroke="#d3dbd7"/><text class="tag" x="58" y="238">DEVICE + CONTACTS</text><text class="label" x="58" y="270">Idsat decrease</text><path d="M325 258H368" stroke="#0f5c63" stroke-width="1.5" marker-end="url(#arrow)"/><text class="body" x="394" y="249">Threshold shift, channel transport or added resistance</text><text class="sub" x="394" y="276">Use Vth and contact data to separate possible contributors.</text><rect x="36" y="321" width="968" height="90" rx="5" fill="#edf3f1" stroke="#d3dbd7"/><text class="tag" x="58" y="346">LEAKAGE</text><text class="label" x="58" y="378">Ioff increase</text><path d="M325 366H368" stroke="#0f5c63" stroke-width="1.5" marker-end="url(#arrow)"/><text class="body" x="394" y="357">Electrostatics, junctions, gate leakage or local defects</text><text class="sub" x="394" y="384">Check bias dependence and the spatial pattern across the wafer.</text><rect x="36" y="429" width="968" height="90" rx="5" fill="#f5f3ed" stroke="#d3dbd7"/><text class="tag" x="58" y="454">CONTACTS / INTERCONNECT</text><text class="label" x="58" y="486">Resistance increase</text><path d="M325 474H368" stroke="#0f5c63" stroke-width="1.5" marker-end="url(#arrow)"/><text class="body" x="394" y="465">Contact or via geometry, interfaces and fill</text><text class="sub" x="394" y="492">Compare resistance structures with inline and process-history data.</text><text class="sub" x="36" y="594">These are investigation paths, not one-to-one mappings from a symptom to a cause.</text></svg>