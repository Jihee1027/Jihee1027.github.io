<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Raspberry Pi image logging at the unloader</title><desc id="d">Cameras triggered at the unloader feed slave Raspberry Pis that capture ROI images, a master Pi that coordinates them over the LAN, and an industrial PC for central logging and review. Below: three layers checked when it failed, and what the images gave the line.</desc><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#333333"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#3d6fa5"/></marker><marker id="a_rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#c47f00"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d4d4d"/></marker><marker id="a_good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#4d8a3f"/></marker></defs><text x="24" y="30" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">My first engineering project of the internship</text><rect x="24" y="44" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="81.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Unloader cameras</text><text x="38" y="98.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Images tied to the</text><text x="38" y="114.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">inspection system</text><rect x="280" y="44" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="294" y="81.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Slave Pis</text><text x="294" y="98.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">ROI image capture</text><text x="294" y="114.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">and logging</text><rect x="536" y="44" width="224" height="96" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/><text x="550" y="81.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Master Pi</text><text x="550" y="98.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Coordinates the slaves</text><text x="550" y="114.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">and the server over the LAN</text><rect x="792" y="44" width="224" height="96" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="806" y="81.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Industrial PC</text><text x="806" y="98.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Central logging and</text><text x="806" y="114.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">review of the images</text><path d="M252 92 L276 92" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M508 92 L532 92" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><path d="M764 92 L788 92" fill="none" stroke="#333333" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_ink)"/><text x="24" y="186" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">Where I looked when it failed</text><rect x="24" y="200" width="320" height="98" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="38" y="227.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">01 · Software</text><text x="38" y="244.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Capture program</text><text x="38" y="261.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">The code running on</text><text x="38" y="277.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">the Pis</text><rect x="360" y="200" width="320" height="98" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="374" y="227.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">02 · Communication</text><text x="374" y="244.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">Pi to Pi to PC</text><text x="374" y="261.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Sockets, image transfer,</text><text x="374" y="277.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">network link</text><rect x="696" y="200" width="320" height="98" rx="7" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/><text x="710" y="227.84" font-size="11.0" font-weight="400" fill="#4d4d4d" text-anchor="start">03 · Signal and hardware</text><text x="710" y="244.76" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">At the bench</text><text x="710" y="261.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Trigger boards, timing, cameras,</text><text x="710" y="277.12" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">cabling</text><path d="M346 249 L358 249" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><path d="M682 249 L694 249" fill="none" stroke="#4d4d4d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a_mute)"/><text x="24" y="340" font-size="12" font-weight="700" fill="#4d4d4d" text-anchor="start">What it gave the line</text><rect stroke-dasharray="5 4" x="24" y="354" width="992" height="70" rx="7" fill="none" stroke="#8d978f" stroke-width="1.2"/><text x="44" y="384" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">Stored images that could be matched to production metrics, so a defect rate could be traced</text><text x="44" y="404" font-size="12.5" font-weight="400" fill="#4d4d4d" text-anchor="start">back to the images behind it.</text></svg>